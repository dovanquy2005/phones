<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Giỏ hàng — fonestore</title>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <link rel="stylesheet" href="assets/css/auth-menu.css"/>
  <link rel="stylesheet" href="assets/css/cart.css"/>

</head>
<body>
<header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại..." aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart" id="navCart">Giỏ hàng</a>
      <a href="login.html">Đăng nhập</a>
      <a href="help.html">Hỗ trợ</a>
    </nav>
  </div>
</header>

<main class="container section cart-page">
  <div class="cart-container">
    <h1 class="cart-title">Giỏ hàng của bạn</h1>
    <div class="cart-grid">
      <section class="cart-card cart-lines">
        <table>
          <colgroup>
            <col style="width:48%">
            <col style="width:14%">
            <col style="width:14%">
            <col style="width:14%">
            <col style="width:10%">
          </colgroup>
          <thead>
          <tr>
            <th>Sản phẩm</th>
            <th class="ta-c">Số lượng</th>
            <th class="ta-r">Đơn giá</th>
            <th class="ta-r">Thành tiền</th>
            <th class="ta-r">Hành động</th>
          </tr>
          </thead>
          <tbody id="lines">
          <tr><td colspan="5" class="muted">Đang tải…</td></tr>
          </tbody>
        </table>
        <!-- phân trang trang 1.2.3... -->
        <div id="cartPager" class="cart-pager" aria-label="Phân trang giỏ hàng"></div>

      </section>

      <aside class="cart-summary">
        <div class="cart-card sum-box">
          <div class="sum-row"><div class="muted">Tạm tính</div><div id="sumSub">—</div></div>
          <div class="sum-row"><div class="muted">Giảm giá</div><div id="sumDis">0 đ</div></div>
          <div class="sum-row"><div class="muted">Phí vận chuyển</div><div id="sumShip">Tính ở bước sau</div></div>
          <div class="sum-row grand"><div>Tổng cộng</div><div id="sumTotal">—</div></div>

          <div class="voucher">
            <input id="voucher" class="input" placeholder="Mã giảm giá (tuỳ chọn)"/>
            <button id="applyVoucher" class="btn btn-outline" type="button">Áp dụng</button>
          </div>

          <div class="actions">
            <a id="btnCheckout" href="#" class="btn-primary">Tiến hành thanh toán</a>
            <a href="products.html" class="btn-outline">Tiếp tục mua sắm</a>
          </div>
          <div id="note" class="muted" style="margin-top:10px"></div>
        </div>
      </aside>
    </div>

    <div id="empty" class="cart-card cart-empty" style="display:none">
      <div class="muted">Giỏ hàng trống.</div>
      <a href="products.html">Xem sản phẩm</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container section"><div class="copyright">© 2025 fonestore</div></div>
</footer>
<script>
(function(){
  const API = 'http://localhost:9090';
  const PLACEHOLDER = 'assets/img/placeholder.png';

  const toImg = u => {
    if (!u) return PLACEHOLDER;
    if (typeof u !== 'string') return PLACEHOLDER;
    if (u.startsWith('http://') || u.startsWith('https://') || u.startsWith('//') || u.startsWith('data:')) return u;
    if (u.startsWith('/')) return u;
    return '/' + u.replace(/^\/+/, '');
  };

  const $ = s => document.querySelector(s);
  const $id = s => document.getElementById(s);
  const fmtVND = n => (Number(n)||0).toLocaleString('vi-VN') + ' đ';
  const token = () => localStorage.getItem('fs_token') || sessionStorage.getItem('fs_token') || '';

  // UID helpers (unchanged)
  function uidFromJWT(){ try{ const t = token(); if(!t || t.split('.').length<2) return 0; const b64 = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); const json = JSON.parse(atob(b64)); const cand = json.userId ?? json.uid ?? json.id ?? json.sub; return Number(cand)||0;}catch{ return 0; } }
  function getUIDLocal(){ try{ const s1 = localStorage.getItem('fs_uid') || sessionStorage.getItem('fs_uid'); if (s1 && Number(s1)>0) return Number(s1); const u = JSON.parse(localStorage.getItem('auth_user') || sessionStorage.getItem('auth_user') || 'null'); if (u && Number(u.id)>0) return Number(u.id); }catch{} return 0; }
  async function fetchUIDFromAPI(){ const t = token(); if(!t) return 0; const headers = { 'Authorization':'Bearer '+t, 'Accept':'application/json' }; const candidates = ['/api/me','/api/user/me','/api/users/me']; for (const u of candidates){ try{ const r = await fetch(API+u, { headers, credentials: 'same-origin' }); if(!r.ok) continue; const j = await r.json(); const id = Number(j?.id ?? j?.userId ?? j?.uid); if (id>0){ try { localStorage.setItem('fs_uid', String(id)); } catch {} return id; } }catch(_){ } } return 0; }
  async function ensureUID(){ let uid = getUIDLocal(); if (uid>0) return uid; uid = uidFromJWT(); if (uid>0){ try{ localStorage.setItem('fs_uid', String(uid)); }catch{}; return uid; } uid = await fetchUIDFromAPI(); return uid||0; }
  const withUID = (u, uid) => `${u}${u.includes('?') ? '&' : '?'}userId=${uid}`;

  // normalizer (unchanged)
  function normLine(item){
    if(!item) return null;
    const id    = item.id ?? item.itemId ?? null;
    const skuId = item.skuId ?? item.sku ?? null;
    const price = Number(item.unitPrice ?? item.price ?? 0);
    const qty   = Math.max(1, Number(item.qty ?? item.quantity ?? 1));
    const total = Number(item.lineTotal ?? (price*qty));
    const name  = item.name ?? item.productName ?? `Sản phẩm #${skuId ?? ''}`;
    const img   = toImg(item.imagePath ?? item.imageUrl ?? item.image ?? '');
    return { id, skuId, name, img: img||PLACEHOLDER, price, qty, total };
  }

  // fetchWithAuth (unchanged)
  function fetchWithAuth(url, opts = {}) {
    const t = token();
    opts.headers = opts.headers || {};
    if (t) {
      opts.headers['Authorization'] = 'Bearer ' + t;
      if (!('credentials' in opts)) opts.credentials = 'same-origin';
    } else {
      if (!('credentials' in opts)) opts.credentials = 'include';
    }
    opts.headers['Accept'] = opts.headers['Accept'] || 'application/json';
    return fetch(url, opts);
  }
// --- fetch full cart DTO from server (items + totals)
async function apiGetCart() {
  try {
    const t = token();
    const headers = { 'Accept': 'application/json', ...(t ? { Authorization: 'Bearer ' + t } : {}) };
    // prefer authenticated GET /api/cart (server should return CartDTO)
    const res = await fetch(API + '/api/cart', { method: 'GET', headers, credentials: 'include' });
    if (res.status === 401) {
      // if not authed, try anonymous /api/cart endpoint (server may allow)
      return { items: [], subtotal: 0, discount: 0, shippingFee: 0, total: 0 };
    }
    if (!res.ok) {
      console.error('apiGetCart failed', res.status, await res.text());
      return { items: [], subtotal: 0, discount: 0, shippingFee: 0, total: 0 };
    }
    const cart = await res.json();
    // Normalize items to lines
    const lines = Array.isArray(cart?.items) ? cart.items.map(normLine).filter(Boolean) : [];
    const subtotal = Number(cart?.subtotal ?? cart?.subTotal ?? lines.reduce((s,l)=>s + l.price*l.qty,0));
    const discount = Number(cart?.discount ?? 0);
    const shippingFee = Number(cart?.shippingFee ?? cart?.shipping ?? 0);
    const total = Number(cart?.total ?? subtotal - discount + shippingFee);
    return { items: lines, subtotal, discount, shippingFee, total, rawCart: cart };
  } catch (e) {
    console.error('apiGetCart exception', e);
    return { items: [], subtotal: 0, discount: 0, shippingFee: 0, total: 0 };
  }
}

  //     try{

  //         const lines = Array.isArray(data?.items) ? data.items

  //     if (uid && uid>0){
  //       const r2 = await fetchWithAuth(API + withUID('/api/cart', uid), { method: 'GET' });
  //       if (r2.ok){
  //         const d = await r2.json();
  //         const lines = Array.isArray(d?.items) ? d.items : Array.isArray(d?.cartItems) ? d.cartItems : [];

  //       if (r3.ok){

  //         const lines = Array.isArray(d?.items) ? d.items : Array.isArray(d?.cartItems) ? d.cartItems : [];

  async function apiUpdateQty(itemId, qty){
    const t = token();
    const headers = { 'Accept':'application/json', 'Content-Type':'application/json' };
    if (t){
      try{
        const r = await fetchWithAuth(API+'/api/cart/items/'+encodeURIComponent(itemId), {
          method:'PUT', headers, body: JSON.stringify({ itemId, qty })
        });
        if (r.ok) return true;
      }catch(_){}
    }

    const uid = await ensureUID();
    const r2 = await fetchWithAuth(API+withUID('/api/cart/items/'+encodeURIComponent(itemId), uid), {
      method:'PUT', headers, body: JSON.stringify({ itemId, qty })
    });
    if(!r2.ok) throw new Error('update failed: '+r2.status);
    return true;
  }

  async function apiRemoveItem(itemId){
    const t = token();
    if (t){
      try{
        const r = await fetchWithAuth(API+'/api/cart/items/'+encodeURIComponent(itemId), { method:'DELETE' });
        if (r.ok) return true;
      }catch(_){}
    }
    const uid = await ensureUID();
    if (uid && uid>0){
      const r2 = await fetchWithAuth(API + withUID('/api/cart/items/'+encodeURIComponent(itemId), uid), { method: 'DELETE' });
      if (r2.ok) return true;
    }
    throw new Error('remove failed');
  }

  // ============= state + pagination config =============
  const PAGE_SIZE = 5; // thay đổi nếu muốn
  const cartState = {
    allLines: [],    // tất cả items (nguồn truth)
    currentPage: 1,
    summary: { subtotal:0, discount:0, shippingFee:0, total:0 }
  };
  const busyIds = new Set();

  // badge & summary use full set
  function badgeUpdateFromAll(){
    const count = cartState.allLines.reduce((s,l)=>s + (Number(l.qty)||0), 0);
    const elById = document.getElementById('navCart');
    if (elById) { elById.textContent = count>0 ? `Giỏ hàng (${count})` : 'Giỏ hàng'; return; }
    const n = document.querySelector('.badge-cart');
    if(n) n.textContent = count>0 ? `Giỏ hàng (${count})` : 'Giỏ hàng';
  }

  function calcAll(lines){
    const sub = lines.reduce((s,l)=>s + l.price*l.qty, 0);
    const discount = 0, ship = 0, total = sub - discount + ship;
    return { sub, discount, ship, total };
  }
  // function updateSummaryFromAll(){
  //   const s = calcAll(cartState.allLines);
  //   $id('sumSub').textContent   = fmtVND(s.sub);
  //   $id('sumDis').textContent   = fmtVND(s.discount);
  //   $id('sumShip').textContent  = s.ship ? fmtVND(s.ship) : 'Tính ở bước sau';
  //   $id('sumTotal').textContent = fmtVND(s.total);
  // }
  function updateSummaryFromAll(){
    // if backend provided summary, use it; otherwise compute locally
    const s = cartState.summary || {};
    if (s && (s.total !== undefined)) {
      $id('sumSub').textContent   = fmtVND(s.subtotal);
      $id('sumDis').textContent   = fmtVND(s.discount);
      $id('sumShip').textContent  = s.shippingFee ? fmtVND(s.shippingFee) : 'Tính ở bước sau';
      $id('sumTotal').textContent = fmtVND(s.total);
      return;
    }
    // fallback compute from lines
    const computed = calcAll(cartState.allLines);
    $id('sumSub').textContent   = fmtVND(computed.sub);
    $id('sumDis').textContent   = fmtVND(computed.discount);
    $id('sumShip').textContent  = computed.ship ? fmtVND(computed.ship) : 'Tính ở bước sau';
    $id('sumTotal').textContent = fmtVND(computed.total);
  }


  // ============= pagination helpers ============
  function totalPages(){
    return Math.max(1, Math.ceil((cartState.allLines.length||0) / PAGE_SIZE));
  }
  function pageSlice(page){
    const p = Math.max(1, Math.min(totalPages(), page));
    const start = (p-1) * PAGE_SIZE;
    return cartState.allLines.slice(start, start + PAGE_SIZE);
  }

  function goToPage(page){
    cartState.currentPage = Math.max(1, Math.min(totalPages(), page));
    renderPage();
  }

  function renderPagination(){
    const pager = $id('cartPager');
    if(!pager) return;
    const pages = totalPages();
    if (pages <= 1) { pager.innerHTML = ''; return; }

    let html = '';
    html += `<button class="page-btn" data-page="prev"${cartState.currentPage===1 ? ' disabled':''}>‹</button>`;

    // render up to 7 page buttons (compact with dots)
    const maxButtons = 7;
    let start = 1, end = pages;
    if (pages > maxButtons){
      const mid = Math.floor(maxButtons/2);
      start = Math.max(1, cartState.currentPage - mid);
      end = start + maxButtons - 1;
      if (end > pages){ end = pages; start = end - maxButtons + 1; }
    }
    if (start > 1) html += `<button class="page-btn" data-page="1">1</button>${start>2?'<span class="dots">…</span>':''}`;

    for(let i = start; i <= end; i++){
      html += `<button class="page-btn" data-page="${i}" ${i===cartState.currentPage ? 'aria-current="true"':''}>${i}</button>`;
    }
    if (end < pages) html += `${end<pages-1?'<span class="dots">…</span>':''}<button class="page-btn" data-page="${pages}">${pages}</button>`;

    html += `<button class="page-btn" data-page="next"${cartState.currentPage===pages ? ' disabled':''}>›</button>`;
    pager.innerHTML = html;

    // attach events
    pager.querySelectorAll('.page-btn').forEach(btn=>{
      const dp = btn.getAttribute('data-page');
      btn.addEventListener('click', (e)=>{
        if (btn.disabled) return;
        if (dp === 'prev') return goToPage(cartState.currentPage - 1);
        if (dp === 'next') return goToPage(cartState.currentPage + 1);
        const n = Number(dp);
        if (!isNaN(n)) goToPage(n);
      });
    });
  }

  // ============= render row / page ============
  function render(lines){
    const body = $id('lines');
    if(!lines || !lines.length){
      body.innerHTML = '<tr><td colspan="5" class="muted">Giỏ hàng trống.</td></tr>';
      $id('empty').style.display = '';
      badgeUpdateFromAll();
      updateSummaryFromAll();
      renderPagination();
      return;
    }
    $id('empty').style.display = 'none';

    const arr = [...lines];
    // note: badge/summary use full dataset
    badgeUpdateFromAll();

    body.innerHTML = arr.map(l=>`
      <tr data-item="${l.id||''}">
        <td>
          <div class="prod">
            <img class="thumb" src="${l.img}" alt="" loading="lazy" data-placeholder="${PLACEHOLDER}">
            <div>
              <div class="name" data-role="name">${l.name}</div>
              <div class="sku">SKU ${l.skuId ? `<span class="pill">#${l.skuId}</span>` : '—'}</div>
            </div>
          </div>
        </td>
        <td class="ta-c">
          <div class="qty">
            <button data-action="dec" type="button" aria-label="Giảm số lượng">−</button>
            <input data-role="qty" type="number" min="1" value="${l.qty}">
            <button data-action="inc" type="button" aria-label="Tăng số lượng">+</button>
          </div>
        </td>
        <td class="ta-r">${fmtVND(l.price)}</td>
        <td class="ta-r" data-role="lineTotal">${fmtVND(l.total)}</td>
        <td class="ta-r actions-cell">
          <button class="btn btn-outline btn-sm" data-action="remove" type="button">Xoá</button>
        </td>
      </tr>`).join('');

    body.querySelectorAll('tr').forEach(tr=>{
      const itemId = tr.dataset.item;
      tr.querySelector('[data-action="inc"]').addEventListener('click', ()=> changeQty(tr, itemId, +1));
      tr.querySelector('[data-action="dec"]').addEventListener('click', ()=> changeQty(tr, itemId, -1));
      let tmr;
      tr.querySelector('[data-role="qty"]').addEventListener('input', (e)=>{
        const v = Math.max(1, Number(e.target.value||1));
        clearTimeout(tmr); tmr = setTimeout(()=> setQty(tr, itemId, v), 300);
      });
      tr.querySelector('[data-action="remove"]').addEventListener('click', ()=> removeLine(tr, itemId));

      tr.querySelectorAll('img.thumb').forEach(img=>{
        img.addEventListener('error', () => {
          img.onerror = null;
          img.src = img.dataset.placeholder || PLACEHOLDER;
        });
      });
    });

    updateSummaryFromAll();
  }

  function renderPage(){
    const pageLines = pageSlice(cartState.currentPage);
    render(pageLines);
    renderPagination();
  }

  // ============= update helpers (operate on allLines) ============
  const pickLine = itemId => cartState.allLines.find(l => String(l.id) === String(itemId));

  async function setQty(tr, itemId, qty){
    const line = pickLine(itemId); if(!line) return;
    if (busyIds.has(itemId)) return;
    busyIds.add(itemId);
    try{
      // update local master
      line.qty = Math.max(1, Number(qty||1));
      line.total = line.qty * line.price;

      // reflect in UI (current row)
      const input = tr.querySelector('[data-role="qty"]');
      if (input) input.value = line.qty;
      const lineTotalEl = tr.querySelector('[data-role="lineTotal"]');
      if (lineTotalEl) lineTotalEl.textContent = fmtVND(line.total);

      // persist
      await apiUpdateQty(itemId, line.qty);

      // refresh summary + badge
      updateSummaryFromAll();
      badgeUpdateFromAll();
    } finally { busyIds.delete(itemId); }
  }
  function changeQty(tr, itemId, delta){
    setQty(tr, itemId, (pickLine(itemId)?.qty||1) + delta);
  }

  async function removeLine(tr, itemId){
    if (busyIds.has(itemId)) return;
    busyIds.add(itemId);
    try{
      await apiRemoveItem(itemId);

      // remove from master list
      cartState.allLines = cartState.allLines.filter(l => String(l.id) !== String(itemId));

      // if current page now empty and not first page, go back one
      const pages = totalPages();
      if (cartState.currentPage > pages) cartState.currentPage = pages;

      renderPage();
    } finally { busyIds.delete(itemId); }
  }

  // ============= load & sync ============
  async function load(){
    try {
      const cartObj = await apiGetCart();
      cartState.allLines = cartObj.items || [];
      cartState.summary = {
        subtotal: Number(cartObj.subtotal || 0),
        discount: Number(cartObj.discount || 0),
        shippingFee: Number(cartObj.shippingFee || 0),
        total: Number(cartObj.total || 0)
      };
    } catch (e) {
      console.error(e);
      cartState.allLines = [];
      cartState.summary = { subtotal:0, discount:0, shippingFee:0, total:0 };
    }
    cartState.currentPage = 1;
    renderPage();
}

  async function syncLocalCartToServer(){
    try {
      const t = token();
      if (!t) return null;
      const raw = localStorage.getItem('fs_cart');
      if (!raw) return null;
      const lines = JSON.parse(raw);
      if (!Array.isArray(lines) || lines.length===0) return null;
      const payload = {
        items: lines.map(i => ({
          skuId: Number(i.sku ?? i.skuId ?? i.id),
          qty: Number(i.qty ?? 1)
        })).filter(it => Number(it.skuId) > 0)
      };
      const r = await fetchWithAuth(API + '/api/cart/merge', { method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if (r.ok){
        try { localStorage.removeItem('fs_cart'); }catch(_){}
        await load();
        return true;
      } else {
        console.warn('merge failed', r.status);
      }
    }catch(err){ console.warn('syncLocalCartToServer error', err); }
    return null;
  }

  // events (unchanged)
  $id('applyVoucher').addEventListener('click', async () => {
    const code = ($id('voucher').value||'').trim();
    if (!code) { $id('note').textContent = 'Vui lòng nhập mã.'; return; }
    $id('note').textContent = 'Đang áp dụng mã...';

    try {
      const tokenVal = token();
      const res = await fetch(`${API}/api/cart/voucher/apply`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(tokenVal ? { Authorization: 'Bearer ' + tokenVal } : {})
        },
        credentials: 'include',
        body: JSON.stringify({ code })
      });

      const payload = await res.json().catch(()=>null);

      if (res.status === 401) {
        $id('note').textContent = 'Bạn cần đăng nhập để dùng mã.';
        return;
      }
      if (!res.ok) {
        // backend trả lỗi kèm message
        const msg = payload && payload.message ? payload.message : `Lỗi server (${res.status})`;
        $id('note').textContent = msg;
        // nếu backend trả updated cart even on non-200, bạn vẫn có thể load()
        return;
      }

      // success — backend thường trả updated cart hoặc success message.
      // reload cart từ server để đồng bộ totals
      await load();

      $id('note').textContent = (payload && payload.message) ? payload.message : 'Áp dụng mã thành công.';
    } catch (e) {
      console.error('apply voucher error', e);
      $id('note').textContent = 'Lỗi khi áp dụng mã, thử lại sau.';
    }
  });



  $id('btnCheckout').addEventListener('click',(e)=>{
    e.preventDefault();
    if(!(cartState.allLines && cartState.allLines.length)) return alert('Giỏ hàng trống.');
    location.href='checkout.html';
  });

  document.addEventListener('cart:changed', load);

  window.__cartDebug = {
    cartState,
    normLine,
    renderPage,
    // helper: set raw and render (rawItems can be array)
    setRawAndRender(rawItems) {
      try {
        const arr = Array.isArray(rawItems) ? rawItems : JSON.parse(rawItems);
        cartState.allLines = arr.map(normLine).filter(Boolean);
        cartState.currentPage = 1;
        renderPage();
        console.info('[cartDebug] rendered', cartState.allLines.length, 'items');
      } catch (e) { console.error('[cartDebug] parse/render error', e); }
    }
  };

  (async ()=>{
    if (token()){
      await syncLocalCartToServer();
    }
    await load();
  })();

})();
</script>
