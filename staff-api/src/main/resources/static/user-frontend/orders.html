<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đơn hàng của tôi — fonestore</title>

  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <link rel="stylesheet" href="assets/css/auth-menu.css"/>
  <link rel="stylesheet" href="assets/css/orders.css">
  
  <style>
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }
    .page-btn {
      min-width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      color: #374151;
      font-weight: 600;
      text-decoration: none;
    }
    .page-btn:hover { background: #f9fafb; }
    .page-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }
    .page-btn.disabled {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại... (placeholder)" aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart" id="navCart">Giỏ hàng</a>
      <a href="login.html" id="navLogin">Đăng nhập</a>
      <a href="help.html">Hỗ trợ</a>
    </nav>
  </div>
</header>

  <main class="container section orders-wrap orders-grid">
    <h1 class="h2 mb-16">Đơn hàng của tôi</h1>

    <div class="card orders-card">
      <div class="orders-head">
        <div>Mã đơn</div>
        <div>Ngày</div>
        <div>Trạng thái</div>
        <div class="num">Tạm tính</div>
        <div class="num">Phí vận chuyển</div>
        <div class="num">Tổng cộng</div>
        <div>Hành động</div>
      </div>

      <div id="ordersList" class="mt-16">
        <div class="sk sk-row" aria-hidden="true"><div class="bar s1"></div><div class="bar s2"></div><div class="bar s3"></div><div class="bar s4"></div><div class="bar s5"></div><div class="bar s6"></div><div class="bar s7"></div></div>
        <div class="sk sk-row" aria-hidden="true" style="margin-top:8px"><div class="bar s1"></div><div class="bar s2"></div><div class="bar s3"></div><div class="bar s4"></div><div class="bar s5"></div><div class="bar s6"></div><div class="bar s7"></div></div>
      </div>
      
      <div id="pagination" class="pagination"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container section">
      <div class="copyright">© 2025 fonestore</div>
    </div>
  </footer>

<script>
  (function(){
    const API = "http://localhost:9090";
    
    // Cấu hình phân trang
    const PAGE_SIZE = 10; // Số dòng mỗi trang
    let allOrders = [];   // Lưu toàn bộ đơn hàng tải về
    let currentPage = 1;  // Trang hiện tại

    // ---- Auth helpers ----
    function getToken(){
      return localStorage.getItem('fs_token') || sessionStorage.getItem('fs_token') || null;
    }

    function getUser(){
      try{ const u = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || 'null'); if(u) return u; }catch(_){}
      try{ const u2 = JSON.parse(localStorage.getItem('fs_user') || 'null'); if(u2) return u2; }catch(_){}
      const t = getToken();
      if(t && t.split('.').length===3){
        try{ const p = JSON.parse(atob(t.split('.')[1])); return { userId: p.uid ?? p.userId ?? p.sub, name: p.name ?? p.email }; }catch(_){}
      }
      return null;
    }

    function setUserBadge(nameOrEmail){
      // Logic badge user nếu cần
    }

    const user = getUser();
    if(!user){ location.replace('login.html'); return; }
    setUserBadge(user.name || user.email || 'User');

    const uid = user.userId ?? user.id ?? user.user_id;
    const $list = document.getElementById('ordersList');
    const $pager = document.getElementById('pagination');

    const money = (n) => (n!=null && !isNaN(n)) ? Number(n).toLocaleString('vi-VN') + ' đ' : '';
    const toDate = (v) => {
      if(!v) return '';
      if(typeof v === 'number'){ if(v < 1e12) v *= 1000; return new Date(v).toLocaleString('vi-VN'); }
      const d = new Date(v); return isNaN(d.getTime()) ? '' : d.toLocaleString('vi-VN');
    };

    const viStatus = (s) => {
      const k = String(s||'').toUpperCase();
      switch(k){
        case 'SHIPPING': return 'Đang giao';
        case 'CREATED': return 'Vừa đặt đơn';
        case 'PENDING': return 'Đang xử lý';
        case 'PAID': return 'Đã thanh toán';
        case 'SHIPPED': return 'Đang giao';
        case 'DELIVERED': return 'Đã giao';
        case 'COMPLETED': return 'Hoàn tất';
        case 'CANCELED': return 'Đã hủy';
        case 'FAILED': return 'Thất bại';
        default: return s || '';
      }
    };

    const statusCls = (s) => 'status status--' + String(s||'').toUpperCase().replace(/\s+/g,'_');

    function rowHTML(o){
      const id = o.orderId ?? o.id ?? o.order_id ?? '';
      const created = toDate(o.createdAt ?? o.created_at ?? o.createdDate);
      const st = String(o.status ?? '').toUpperCase();
      const subtotal = money(o.subtotal ?? o.sub_total ?? (o.lines && Array.isArray(o.lines) ? o.lines.reduce((acc,l)=>acc + (Number(l.unitPrice||0) * Number(l.qty||0)),0) : 0));
      const ship = money(o.shippingFee ?? o.shipping_fee ?? 0);
      const total = money(o.total ?? o.grandTotal ?? (Number(o.subtotal||0) + Number(o.shippingFee||o.shipping_fee||0)));

      return `
        <div class="order-row">
          <div class="cell" data-label="Mã đơn">#${id}</div>
          <div class="cell" data-label="Ngày">${created}</div>
          <div class="cell" data-label="Trạng thái"><span class="${statusCls(st)}">${viStatus(st)}</span></div>
          <div class="cell num" data-label="Tạm tính">${subtotal}</div>
          <div class="cell num" data-label="Phí vận chuyển">${ship}</div>
          <div class="cell num" data-label="Tổng cộng">${total}</div>
          <div class="cell actions" data-label="Hành động">
            <a href="order-detail.html?id=${encodeURIComponent(id)}">Xem chi tiết</a>
          </div>
        </div>
      `;
    }

    // [MỚI] Hàm render danh sách theo trang
    function renderPage(page) {
        if (!allOrders || allOrders.length === 0) {
            $list.innerHTML = `<div class="empty"><img src="assets/img/empty-box.svg" alt="" style="width:72px;opacity:.6"><div>Chưa có đơn hàng nào</div></div>`;
            $pager.innerHTML = '';
            return;
        }

        const totalPages = Math.ceil(allOrders.length / PAGE_SIZE);
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        currentPage = page;

        const start = (page - 1) * PAGE_SIZE;
        const end = start + PAGE_SIZE;
        const pageItems = allOrders.slice(start, end);

        $list.innerHTML = pageItems.map(rowHTML).join('');
        renderPaginationControls(totalPages);
    }

    // [MỚI] Hàm vẽ nút phân trang
    function renderPaginationControls(totalPages) {
        if (totalPages <= 1) {
            $pager.innerHTML = '';
            return;
        }

        let html = '';
        // Nút Prev
        html += `<a class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="window.changePage(${currentPage - 1})">«</a>`;

        // Các trang số
        for (let i = 1; i <= totalPages; i++) {
            if (totalPages > 7 && Math.abs(i - currentPage) > 2 && i !== 1 && i !== totalPages) {
                if (html.endsWith('...</span>')) continue;
                html += `<span style="padding: 0 4px;">...</span>`;
                continue;
            }
            html += `<a class="page-btn ${i === currentPage ? 'active' : ''}" onclick="window.changePage(${i})">${i}</a>`;
        }

        // Nút Next
        html += `<a class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="window.changePage(${currentPage + 1})">»</a>`;

        $pager.innerHTML = html;
    }

    // [MỚI] Expose hàm đổi trang ra global để gọi từ onclick
    window.changePage = function(p) {
        renderPage(p);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function showError(msg){
      $list.innerHTML = `<div class="alert-inline">${msg}</div>`;
    }

    const headers = {'Accept':'application/json'};
    const tokenStr = getToken();
    if(tokenStr) headers['Authorization'] = 'Bearer ' + tokenStr;

    const url = `${API}/api/user/orders?userIdParam=${encodeURIComponent(uid)}&t=${Date.now()}`;
    
    fetch(url, { headers, credentials: 'include' })
      .then(resp => {
        if(resp.status === 401){ 
          ['user','fs_user','fs_token'].forEach(k=>{ localStorage.removeItem(k); sessionStorage.removeItem(k); });
          location.replace('login.html');
          throw new Error('Unauthenticated');
        }
        if(!resp.ok){ throw new Error('HTTP '+resp.status); }
        return resp.json();
      })
      .then(body => {
        let arr = [];
        if(Array.isArray(body)) arr = body;
        else if(body == null) arr = [];
        else if(Array.isArray(body.items)) arr = body.items;
        else if(Array.isArray(body.data)) arr = body.data;
        else { if(body.orderId || body.id) arr = [body]; else arr = []; }

        // Lưu toàn bộ đơn hàng và render trang 1
        allOrders = arr;
        renderPage(1);
      })
      .catch(err => {
        console.error('Load orders failed', err);
        showError('Không tải được danh sách đơn hàng. Vui lòng thử lại sau.');
      });

    document.getElementById('logoutBtn')?.addEventListener('click', ()=> {
      ['user','fs_user','fs_token'].forEach(k=>{ localStorage.removeItem(k); sessionStorage.removeItem(k); });
      location.replace('login.html');
    });
  })();
  </script>

<script src="assets/js/core/fetch-cred-patch.js"></script>
<script type="module" src="assets/js/core/auth.js"></script>
<script type="module" src="assets/js/core/header-auth.js"></script>
<script src="assets/js/core/dropdown-fix.js"></script>
<script src="assets/js/core/auth-menu-inject.js"></script>
<script src="assets/js/core/cart-guard.js"></script>
<script src="assets/js/core/compat-pid.js"></script>
<script src="assets/js/core/cart-badge.js"></script>
</body>
</html>
