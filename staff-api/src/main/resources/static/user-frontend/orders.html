<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đơn hàng của tôi — fonestore</title>

  <!-- CSS tổng từ dự án -->
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <link rel="stylesheet" href="assets/css/auth-menu.css"/>

  <style>
    /* ----- Orders layout (bám token ở base.css) ----- */
    .orders-wrap{min-height:calc(100vh - var(--header-h) - 120px)}
    .orders-card{padding:16px}

    /* Khai báo cột một lần để header & row dùng chung → luôn thẳng hàng */
    .orders-grid{ --cols: 120px 1fr 140px 140px 140px 160px 140px; }

    .orders-head,
    .order-row{
      display:grid;
      grid-template-columns: var(--cols);
      gap:12px;
      align-items:center;
    }

    .orders-head{
      font-weight:700;
      color:var(--muted);
      padding:8px 8px 12px;
    }

    .order-row{
      background:#fff;
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px 10px;
      box-shadow:var(--shadow-sm);
      transition: box-shadow .15s ease, transform .05s ease;
    }
    .order-row:hover{ box-shadow:var(--shadow-md); }

    .num{text-align:right; font-variant-numeric:tabular-nums;}
    .actions a{ color:var(--brand); font-weight:700; }
    .actions a:hover{ text-decoration:underline; }

    /* Badge trạng thái */
    .status{
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800;
      background:#EFF6FF; color:var(--brand);
      border:1px solid var(--border);
      white-space:nowrap;
    }
    .status--PAID,.status--DELIVERED,.status--COMPLETED{ background:#E6F6EF; color:#0B8E4A; }
    .status--SHIPPED{ background:#EEF6FF; color:#0C63D6; }
    .status--CANCELED,.status--FAILED{ background:#FFEEEE; color:#D72323; }

    /* Skeleton khi đang tải */
    .sk{border:1px solid var(--border); border-radius:12px; background:#fff; overflow:hidden;}
    .sk-row{
      display:grid; grid-template-columns: var(--cols); gap:12px; align-items:center; padding:12px 10px;
    }
    .bar{height:16px; background:linear-gradient(90deg,#eee 25%,#f6f6f6 37%,#eee 63%); background-size:400% 100%; animation:shimmer 1.2s infinite;}
    .s1{width:60px}.s2{width:50%}.s3{width:90px}.s4{width:100px}.s5{width:110px}.s6{width:140px}.s7{width:80px}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

    .empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);padding:24px 0}

    /* Mobile: chuyển thành thẻ có nhãn */
    @media (max-width: 900px){
      .orders-head{ display:none; }
      .order-row{
        grid-template-columns: 1fr;
        row-gap:8px;
      }
      .cell{
        display:grid; grid-template-columns: 140px 1fr; column-gap:10px; align-items:center;
      }
      .cell::before{
        content: attr(data-label);
        color:var(--muted);
        font-size:13px;
      }
      .num{ justify-self:end; }
      .actions{ display:flex; justify-content:flex-end; }
      .sk-row{ grid-template-columns: 1fr; }
      .s1,.s2,.s3,.s4,.s5,.s6,.s7{ width:100%; }
    }
  </style>
</head>
<body>
  <!-- Header chuẩn (base.css + auth-menu.css) -->
  <header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại... (placeholder)" aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart">Giỏ hàng</a>
      <a href="login.html">Đăng nhập</a>
      <a href="help.html">Hỗ trợ</a>
    </nav>
  </div>
</header>

  <main class="container section orders-wrap orders-grid">
    <h1 class="h2 mb-16">Đơn hàng của tôi</h1>

    <div class="card orders-card">
      <div class="orders-head">
        <div>Mã đơn</div>
        <div>Ngày</div>
        <div>Trạng thái</div>
        <div class="num">Tạm tính</div>
        <div class="num">Phí vận chuyển</div>
        <div class="num">Tổng cộng</div>
        <div>Hành động</div>
      </div>

      <div id="ordersList" class="mt-16">
        <!-- Skeleton 3 hàng -->
        <div class="sk sk-row" aria-hidden="true">
          <div class="bar s1"></div><div class="bar s2"></div><div class="bar s3"></div>
          <div class="bar s4"></div><div class="bar s5"></div><div class="bar s6"></div><div class="bar s7"></div>
        </div>
        <div class="sk sk-row" aria-hidden="true" style="margin-top:8px">
          <div class="bar s1"></div><div class="bar s2"></div><div class="bar s3"></div>
          <div class="bar s4"></div><div class="bar s5"></div><div class="bar s6"></div><div class="bar s7"></div>
        </div>
        <div class="sk sk-row" aria-hidden="true" style="margin-top:8px">
          <div class="bar s1"></div><div class="bar s2"></div><div class="bar s3"></div>
          <div class="bar s4"></div><div class="bar s5"></div><div class="bar s6"></div><div class="bar s7"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container section">
      <div class="copyright">© 2025 fonestore</div>
    </div>
  </footer>
<script>
  (function(){
    const API = "http://localhost:9090";

    // ---- Auth menu nhỏ gọn (khớp auth-menu.css) ----
    const btn = document.getElementById('userBtn');
    const drop = document.getElementById('userDrop');
    btn?.addEventListener('click', ()=> drop.style.display = drop.style.display==='block' ? 'none' : 'block');
    document.addEventListener('click', (e)=>{ if(!btn.contains(e.target) && !drop.contains(e.target)) drop.style.display='none'; });

    function setUserBadge(nameOrEmail){
      const ua = document.getElementById('ua');
      const un = document.getElementById('un');
      const name = (nameOrEmail||'User').toString();
      un.textContent = name;
      ua.textContent = name.trim()[0]?.toUpperCase() || 'U';
    }

    // Lấy user từ localStorage/sessionStorage/JWT như các trang khác
    function getUser(){
      try{ const u = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || 'null'); if(u) return u; }catch(_){}
      try{ const u2 = JSON.parse(localStorage.getItem('fs_user') || 'null'); if(u2) return u2; }catch(_){}
      const t = localStorage.getItem('fs_token') || sessionStorage.getItem('fs_token');
      if(t && t.split('.').length===3){
        try{ const p = JSON.parse(atob(t.split('.')[1])); return { userId: p.uid ?? p.userId ?? p.sub, name: p.name ?? p.email }; }catch(_){}
      }
      return null;
    }

    const user = getUser();
    if(!user){ location.replace('login.html'); return; }
    setUserBadge(user.name || user.email || 'User');

    const uid = user.userId ?? user.id ?? user.user_id;
    const $list = document.getElementById('ordersList');

    const money = (n) => (n!=null && !isNaN(n)) ? Number(n).toLocaleString('vi-VN') + ' đ' : '';
    const toDate = (v) => {
      if(!v) return '';
      if(typeof v === 'number'){ if(v < 1e12) v *= 1000; return new Date(v).toLocaleString('vi-VN'); }
      const d = new Date(v); return isNaN(d.getTime()) ? '' : d.toLocaleString('vi-VN');
    };

    const viStatus = (s) => {
      const k = String(s||'').toUpperCase();
      switch(k){
        case 'PENDING': return 'Đang xử lý';
        case 'PAID': return 'Đã thanh toán';
        case 'SHIPPED': return 'Đang giao';
        case 'DELIVERED': return 'Đã giao';
        case 'COMPLETED': return 'Hoàn tất';
        case 'CANCELED': return 'Đã hủy';
        case 'FAILED': return 'Thất bại';
        default: return s || '';
      }
    };

    const statusCls = (s) => 'status status--' + String(s||'').toUpperCase().replace(/\s+/g,'_');

    function rowHTML(o){
      const id = o.orderId ?? o.id ?? o.code ?? '';
      const created = toDate(o.createdAt ?? o.created_at ?? o.createdDate);
      const st = String(o.status ?? '').toUpperCase();

      const subtotal = money(o.subtotal ?? o.sub_total ?? o.itemsSubtotal ?? o.tempTotal);
      const ship = money(o.shippingFee ?? o.shipping_fee ?? o.ship_fee);
      const total = money(o.total ?? o.grandTotal ?? o.amount);

      return `
        <div class="order-row">
          <div class="cell" data-label="Mã đơn">#${id}</div>
          <div class="cell" data-label="Ngày">${created}</div>
          <div class="cell" data-label="Trạng thái"><span class="${statusCls(st)}">${viStatus(st)}</span></div>
          <div class="cell num" data-label="Tạm tính">${subtotal}</div>
          <div class="cell num" data-label="Phí vận chuyển">${ship}</div>
          <div class="cell num" data-label="Tổng cộng">${total}</div>
          <div class="cell actions" data-label="Hành động">
            <a href="order-detail.html?id=${encodeURIComponent(id)}">Xem chi tiết</a>
          </div>
        </div>
      `;
    }

    function emptyHTML(){
      return `<div class="empty">
        <img src="assets/img/empty-box.svg" alt="" style="width:72px;opacity:.6">
        <div>Chưa có đơn hàng nào</div>
      </div>`;
    }

    fetch(`${API}/api/public/orders?userId=${encodeURIComponent(uid)}&t=${Date.now()}`, { headers: {'Accept':'application/json'} })
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(arr => {
        if(!Array.isArray(arr) || arr.length===0){ $list.innerHTML = emptyHTML(); return; }
        $list.innerHTML = arr.map(rowHTML).join('');
      })
      .catch(err => {
        console.error(err);
        $list.innerHTML = `<div class="alert">Không tải được danh sách đơn hàng. Vui lòng thử lại sau.</div>`;
      });

    // Đăng xuất nhanh
    document.getElementById('logoutBtn')?.addEventListener('click', ()=>{
      ['user','fs_user','fs_token'].forEach(k=>{ localStorage.removeItem(k); sessionStorage.removeItem(k); });
      location.replace('login.html');
    });
  })();
  </script>
<!-- auto-injected: auth core -->







<!-- core scripts (standardized) -->
<script src="assets/js/core/fetch-cred-patch.js"></script>
<script type="module" src="assets/js/core/auth.js"></script>
<script type="module" src="assets/js/core/header-auth.js"></script>
<script src="assets/js/core/dropdown-fix.js"></script>
<script src="assets/js/core/auth-menu-inject.js"></script>
<script src="assets/js/core/cart-guard.js"></script>
<script src="assets/js/core/compat-pid.js"></script>
<script src="assets/js/core/cart-badge.js"></script>
</body>
</html>
