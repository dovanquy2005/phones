<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hồ sơ — fonestore</title>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <link rel="stylesheet" href="assets/css/auth-menu.css"/>
  <style>
    .profile-wrap{min-height:calc(100vh - var(--header-h) - 120px)}
    .profile-card{max-width:720px;margin:0 auto}
    /* Alert styles */
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
    .alert.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .alert.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  </style>
</head>
<body>
<header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại... (placeholder)" aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart">Giỏ hàng</a>
      <a href="login.html">Đăng nhập</a>
      <a href="help.html">Hỗ trợ</a>
    </nav>
  </div>
</header>

<main class="container section profile-wrap">
  <div class="card p-16 profile-card">
    <h1 class="h2">Chỉnh sửa thông tin</h1>
    
    <div id="msg" class="alert"></div>

    <form id="form-profile" class="mt-16">
      <div class="field">
        <label class="label">Email</label>
        <input id="email" class="input" disabled style="background-color: #f3f4f6; cursor: not-allowed;">
      </div>
      
      <div class="field mt-12">
        <label class="label">Họ tên</label>
        <input id="fullName" class="input" placeholder="Nhập họ tên của bạn">
      </div>
      
      <div class="field mt-12">
        <label class="label">Số điện thoại</label>
        <input id="phone" class="input" placeholder="Số điện thoại liên hệ">
      </div>

      <div class="field mt-12">
        <label class="label">Địa chỉ mặc định</label>
        <input id="address" class="input" placeholder="Số nhà, đường, phường/xã...">
      </div>
      
      <div class="row mt-12">
        <div class="field" style="flex:1">
          <label class="label">Ngày sinh</label>
          <input id="dob" type="date" class="input">
        </div>
        <div class="field" style="flex:1">
          <label class="label">Giới tính</label>
          <select id="gender" class="input">
            <option value="">— Chọn —</option>
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
      </div>

      <div class="mt-24 text-right">
         <button class="btn btn-primary" type="submit" id="btnSave">Lưu thay đổi</button>
      </div>
    </form>
  </div>
</main>

<footer class="footer"><div class="container section"><div class="copyright">© 2025 fonestore</div></div></footer>

<script>
(function(){
  const API_BASE = "http://localhost:9090";
  const token = localStorage.getItem('fs_token') || sessionStorage.getItem('fs_token');
  
  // 1. Check login
  if (!token) { 
    window.location.replace('login.html'); 
    return; 
  }

  const headers = { 
    'Content-Type': 'application/json', 
    'Authorization': 'Bearer ' + token 
  };

  const $ = id => document.getElementById(id);
  const elMsg = $('msg');
  const btnSave = $('btnSave');

  function showMsg(text, type='success'){
    elMsg.textContent = text;
    elMsg.className = 'alert ' + type;
    elMsg.style.display = 'block';
    setTimeout(()=>{ elMsg.style.display='none'; }, 3000);
  }

  // 2. Load profile data (GET)
  async function loadProfile() {
    try {
      const res = await fetch(API_BASE + '/api/user/profile', { headers });
      if (res.status === 401) {
        localStorage.removeItem('fs_token');
        window.location.replace('login.html');
        return;
      }
      if (!res.ok) throw new Error('Không thể tải thông tin');
      
      const data = await res.json();
      
      // Fill form
      $('email').value    = data.email || '';
      $('fullName').value = data.fullName || '';
      $('phone').value    = data.phone || '';
      $('address').value  = data.address || ''; // Field mới
      $('gender').value   = data.gender || '';
      if (data.dob) $('dob').value = data.dob;

    } catch (err) {
      console.error(err);
      showMsg('Lỗi tải dữ liệu: ' + err.message, 'error');
    }
  }

  // 3. Handle Update (PUT)
  $('form-profile').addEventListener('submit', async (e) => {
    e.preventDefault();
    btnSave.disabled = true; 
    btnSave.textContent = 'Đang lưu...';

    const payload = {
      fullName: $('fullName').value.trim(),
      phone:    $('phone').value.trim(),
      address:  $('address').value.trim(),
      dob:      $('dob').value || null,
      gender:   $('gender').value || null
    };

    try {
      const res = await fetch(API_BASE + '/api/user/profile', { 
        method: 'PUT', 
        headers, 
        body: JSON.stringify(payload) 
      });
      
      if (!res.ok) {
         const txt = await res.text();
         throw new Error(txt || 'Cập nhật thất bại');
      }

      // Cập nhật lại thông tin user trong localStorage (để header hiển thị tên mới nếu có)
      const updatedUser = await res.json();
      const localUser = JSON.parse(localStorage.getItem('fs_user') || '{}');
      localUser.fullName = updatedUser.fullName; 
      localUser.name = updatedUser.fullName; // Đồng bộ tên hiển thị
      localStorage.setItem('fs_user', JSON.stringify(localUser));
      
      // Dispatch event để header cập nhật lại tên
      window.dispatchEvent(new Event('storage'));

      showMsg('Đã lưu thay đổi thành công!', 'success');
    } catch (err) {
      showMsg(err.message, 'error');
    } finally {
      btnSave.disabled = false;
      btnSave.textContent = 'Lưu thay đổi';
    }
  });

  // Init
  loadProfile();
})();
</script>

<script src="assets/js/core/fetch-cred-patch.js"></script>
<script type="module" src="assets/js/core/auth.js"></script>
<script type="module" src="assets/js/core/header-auth.js"></script>
<script src="assets/js/core/dropdown-fix.js"></script>
<script src="assets/js/core/auth-menu-inject.js"></script>
<script src="assets/js/core/cart-guard.js"></script>
<script src="assets/js/core/compat-pid.js"></script>
<script src="assets/js/core/cart-badge.js"></script>
</body>
</html>
