</head><body>
<header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại... (placeholder)" aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart">Giỏ hàng</a>

<main class="container section">
  <div class="card p-16" style="text-align:center">
    <h1 class="h1">✅ Cảm ơn bạn đã đặt hàng!</h1>
    <p class="muted">Mã đơn của bạn: <strong>#FS123456</strong></p>

<!-- auto-injected: auth core -->
 <!-- === BẮT ĐẦU: SCRIPT LÀM TRANG SUCCESS "HOẠT ĐỘNG" === -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    try {
        // 1. Lấy mã đơn hàng từ URL
        const params = new URLSearchParams(window.location.search);
        
        // (Dựa theo checkout.html, bạn dùng ?order=)
        const orderId = params.get('order') || params.get('orderId'); 

        // 2. Tìm thẻ <strong> để hiển thị mã đơn
        const orderCodeElement = document.querySelector('.card strong');

        if (orderId && orderCodeElement) {
            // 3. Cập nhật mã đơn hàng thật vào giao diện
            // (Bạn có thể format lại nếu muốn, ví dụ "OD-000123")
            orderCodeElement.textContent = `#${orderId}`;
        }

        // 4. (Quan trọng) Xóa giỏ hàng khỏi localStorage
        // Dựa trên file cart-client.js, key của bạn là 'fs_cart_local_v1'
        // Hoặc bạn có thể dùng các hàm trong cart-guard.js nếu chúng global
        localStorage.removeItem('fs_cart_local_v1'); // Xóa giỏ hàng local
        localStorage.removeItem('fs_cart'); // Xóa key cũ (nếu có)
        
        // (Nếu bạn có giỏ hàng riêng cho user đã đăng nhập, cũng nên xóa)
        // Ví dụ, nếu bạn dùng 'fs_cart_<userId>', bạn cần logic để lấy userId và xóa
        
        // 5. Báo cho cart-badge.js (và các script khác) biết giỏ hàng đã thay đổi
        // để nó cập nhật số lượng trên header về 0.
        window.dispatchEvent(new Event('storage'));
        window.dispatchEvent(new CustomEvent('cart:changed', { detail: { count: 0 } }));

    } catch (e) {
        console.error("Lỗi xử lý trang success:", e);
    }
});
</script>
<!-- === KẾT THÚC: SCRIPT === -->
<!-- core scripts (standardized) -->

<script src="assets/js/core/cart-badge.js"></script>


</body>
</html>
