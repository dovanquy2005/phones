<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Thanh toán — fonestore</title>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <link rel="stylesheet" href="assets/css/auth-menu.css"/>
  <style>
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .grid{display:grid;gap:24px}
    .grid-2{grid-template-columns:1fr 360px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 6px 16px rgba(15,23,42,.06)}
    .card .inner{padding:20px}
    .h1{font-size:32px;margin:16px 0 12px}
    .h3{font-size:18px;font-weight:700}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .muted{color:#64748B}
    .input{height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:10px;width:100%}
    .btn{height:40px;padding:0 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;cursor:pointer}
    .btn.primary{background:#3B82F6;color:#fff;border-color:#3B82F6}
    .radio{display:flex;gap:12px;flex-wrap:wrap}
    .radio label{display:flex;align-items:center;gap:8px;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;cursor:pointer}
    .summary ul{list-style:none;margin:0;padding:0}
    .summary li{display:flex;justify-content:space-between;padding:6px 0}
    .muted-small{color:#64748B;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
<header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại... (placeholder)" aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart">Giỏ hàng</a>
      <a href="login.html">Đăng nhập</a>
      <a href="help.html">Hỗ trợ</a>
    </nav>
  </div>
</header>

<main class="container">
  <h1 class="h1">Thanh toán</h1>

  <div class="grid grid-2">
    <!-- left: form -->
    <section class="card">
      <div class="inner">
        <div class="h3">Thông tin giao hàng</div>
        <form id="checkout-form" class="grid" style="grid-template-columns:1fr 1fr;gap:12px" novalidate>
          <div style="grid-column:1/2"><label>Họ tên</label><input id="name" class="input" required></div>
          <div style="grid-column:2/3"><label>Email</label><input id="email" class="input" type="email" required></div>
          <div style="grid-column:1/2"><label>Số điện thoại</label><input id="phone" class="input" pattern="[0-9]{9,11}" required></div>
          <div style="grid-column:1/-1"><label>Địa chỉ</label><input id="addr" class="input" required></div>

          <div style="grid-column:1/-1;margin-top:8px" class="h3">Phương thức thanh toán</div>
          <div class="radio" style="grid-column:1/-1">
            <label><input type="radio" name="pay" value="cod" checked> COD (Thanh toán khi nhận hàng)</label>
            <label><input type="radio" name="pay" value="bank"> Chuyển khoản</label>
            <label><input type="radio" name="pay" value="card"> Thẻ (Visa/Master)</label>
          </div>

          <div class="row" style="grid-column:1/-1;justify-content:space-between;margin-top:8px">
            <a href="cart.html" class="btn">← Quay lại giỏ</a>
            <button class="btn primary" id="placeOrder" type="submit">Đặt hàng</button>
          </div>
          <div id="form-error" class="muted" style="color:#ef4444;display:none">Vui lòng điền đúng và đủ thông tin.</div>
        </form>
      </div>
    </section>

    <!-- right: simplified summary (only totals) -->
    <aside class="card summary">
      <div class="inner">
        <ul>
          <li><span>Tạm tính</span><span id="sub">0₫</span></li>
          <li><span>Giảm giá</span><span id="discount">−0₫</span></li>
          <li><span>Phí vận chuyển</span><span id="ship">Tính ở bước sau</span></li>
          <li style="font-weight:800"><span>Tổng cộng</span><span id="total">0₫</span></li>
        </ul>

        <div id="checkout-note" class="muted" style="margin-top:8px"></div>
      </div>
    </aside>
  </div>
</main>

<footer class="footer">
  <div class="container section"><div class="copyright">© 2025 fonestore</div></div>
</footer>

<script>
(() => {
  const API = 'http://localhost:9090'; // chỉnh nếu khác
  const fmt = n => (Number(n)||0).toLocaleString('vi-VN') + ' ₫';
  const token = () => localStorage.getItem('fs_token') || sessionStorage.getItem('fs_token') || '';

  // GET /api/checkout -> returns full checkout DTO (server-side recalc)
  async function apiGetCheckout() {
    try {
      const headers = { 'Accept': 'application/json' };
      const t = token();
      if (t) headers['Authorization'] = 'Bearer ' + t;
      const res = await fetch(API + '/api/checkout', { method: 'GET', headers, credentials: 'include' });
      if (!res.ok) {
        console.error('apiGetCheckout failed', res.status);
        return { ok:false, status: res.status, body: null };
      }
      const body = await res.json();
      return { ok:true, body };
    } catch (e) {
      console.error('apiGetCheckout err', e);
      return { ok:false, status:0, body:null };
    }
  }

  // POST /api/checkout -> place order
  async function apiPlaceOrder(payload) {
    try {
      const headers = { 'Content-Type': 'application/json' };
      const t = token();
      if (t) headers['Authorization'] = 'Bearer ' + t;
      const res = await fetch(API + '/api/checkout', { method: 'POST', headers, credentials: 'include', body: JSON.stringify(payload) });
      const body = await res.json().catch(()=>({}));
      return { ok: res.ok, status: res.status, body };
    } catch (e) {
      console.error('apiPlaceOrder err', e);
      return { ok:false, status:0, body:null };
    }
  }

  // render totals into UI (we only show totals)
  function renderTotalsFromResponse(body) {
    const subtotal = Number(body.subtotal ?? body.subTotal ?? body.totals?.subtotal ?? 0);
    const discount = Number(body.discount ?? body.discountAmount ?? body.totals?.discount ?? 0);
    const shipping = Number(body.shipping ?? body.shippingFee ?? body.totals?.shipping ?? 0);
    const total = Number(body.total ?? body.grand_total ?? body.totals?.grand_total ?? subtotal - discount + shipping);
    const subEl = document.getElementById('sub');
    const disEl = document.getElementById('discount');
    const shipEl = document.getElementById('ship');
    const totalEl = document.getElementById('total');
    if (subEl) subEl.textContent = fmt(subtotal);
    if (disEl) disEl.textContent = (discount>0) ? '−' + fmt(discount) : '−0₫';
    if (shipEl) shipEl.textContent = (shipping>0) ? fmt(shipping) : 'Tính ở bước sau';
    if (totalEl) totalEl.textContent = fmt(total);
  }

  // load checkout totals (called on page load)
  async function loadCheckoutTotals() {
    const note = document.getElementById('checkout-note');
    if (note) note.textContent = 'Đang tải tổng tiền...';
    const r = await apiGetCheckout();
    if (!r.ok) {
      if (note) note.textContent = 'Không thể lấy tổng tiền. Vui lòng thử lại.';
      renderTotalsFromResponse({});
      return;
    }
    const body = r.body || {};
    renderTotalsFromResponse(body);

    // if warnings exist, redirect user back to cart (simple UX)
    if (Array.isArray(body.warnings) && body.warnings.length > 0) {
      alert('Có thay đổi trong giỏ hàng (ví dụ: giá, mã giảm, hoặc hết hàng). Bạn sẽ được chuyển về Giỏ hàng để kiểm tra lại.');
      window.location.href = '/cart.html';
      return;
    }
    if (note) note.textContent = '';
  }

  // form submit: re-check then place order
  async function handleSubmit(ev) {
    ev.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const addr = document.getElementById('addr').value.trim();
    const email = document.getElementById('email').value.trim();
    if (!name || !phone || !addr) {
      document.getElementById('form-error').style.display = 'block';
      return;
    } else {
      document.getElementById('form-error').style.display = 'none';
    }

    const placeBtn = document.getElementById('placeOrder');
    placeBtn.disabled = true; placeBtn.textContent = 'Đang kiểm tra...';

    // re-check server-side
    const check = await apiGetCheckout();
    if (!check.ok) {
      alert('Không thể kiểm tra tổng tiền. Thử lại sau.');
      placeBtn.disabled = false; placeBtn.textContent = 'Đặt hàng';
      return;
    }
    if (Array.isArray(check.body?.warnings) && check.body.warnings.length > 0) {
      alert('Phát hiện thay đổi trong giỏ hàng. Bạn sẽ được chuyển về Giỏ hàng để kiểm tra lại.');
      window.location.href = '/cart.html';
      return;
    }

    // build payload (server reads cart/voucher from server-side cart)
    const payload = {
      payment_method: document.querySelector('input[name="pay"]:checked').value,
      shipping_address: { name, phone, email, address: addr }
    };

    placeBtn.textContent = 'Đang đặt...';
    const res = await apiPlaceOrder(payload);
    if (!res.ok) {
      // expected: 409 with reason or validation error
      if (res.status === 409 && res.body && res.body.reason) {
        alert('Không thể đặt hàng: ' + res.body.reason);
      } else {
        alert('Đặt hàng thất bại. Vui lòng thử lại.');
      }
      placeBtn.disabled = false; placeBtn.textContent = 'Đặt hàng';
      // if server returned warnings or updated totals, reload totals for user
      if (res.body?.warnings) {
        alert('Có thay đổi trong giỏ hàng — chuyển về giỏ để kiểm tra.');
        window.location.href = '/cart.html';
      } else {
        // refresh totals in case server adjusted something
        await loadCheckoutTotals();
      }
      return;
    }

    // success
    const orderId = res.body?.order_id || res.body?.id || '';
    alert('Đặt hàng thành công! Mã đơn: ' + (orderId || '---'));
    window.location.href = `/order-success.html?order=${encodeURIComponent(orderId)}`;
  }

  // bind
  document.getElementById('checkout-form').addEventListener('submit', handleSubmit);

  // init on load
  (async () => {
    await loadCheckoutTotals();
  })();

})();
</script>

<!-- core scripts (unchanged) -->
<script src="assets/js/core/fetch-cred-patch.js"></script>
<script type="module" src="assets/js/core/auth.js"></script>
<script type="module" src="assets/js/core/header-auth.js"></script>
<script src="assets/js/core/dropdown-fix.js"></script>
<script src="assets/js/core/auth-menu-inject.js"></script>
<script src="assets/js/core/cart-guard.js"></script>
<script src="assets/js/core/compat-pid.js"></script>
<script type="module" src="assets/js/core/cart-badge.js"></script>

</body>
</html>
