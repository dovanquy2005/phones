<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Thanh toán — fonestore</title>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <link rel="stylesheet" href="assets/css/auth-menu.css"/>
  <style>
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .grid{display:grid;gap:24px}
    .grid-2{grid-template-columns:1fr 360px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 6px 16px rgba(15,23,42,.06)}
    .card .inner{padding:20px}
    .h1{font-size:32px;margin:16px 0 12px}
    .h3{font-size:18px;font-weight:700}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .muted{color:#64748B}
    .input{height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:10px;width:100%}
    .btn{height:40px;padding:0 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;cursor:pointer}
    .btn.primary{background:#3B82F6;color:#fff;border-color:#3B82F6}
    .radio{display:flex;gap:12px;flex-wrap:wrap}
    .radio label{display:flex;align-items:center;gap:8px;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;cursor:pointer}
    .summary ul{list-style:none;margin:0;padding:0}
    .summary li{display:flex;justify-content:space-between;padding:6px 0}
    .code-hint{font-size:12px;color:#64748B;margin-top:6px}
  </style>
</head>
<body>
<header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại... (placeholder)" aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart">Giỏ hàng</a>
      <a href="login.html">Đăng nhập</a>
      <a href="help.html">Hỗ trợ</a>
    </nav>
  </div>
</header>

<main class="container">
  <h1 class="h1">Thanh toán</h1>
  <div class="grid grid-2">
    <section class="card">
      <div class="inner">
        <div class="h3">Thông tin giao hàng</div>
        <form id="checkout-form" class="grid" style="grid-template-columns:1fr 1fr;gap:12px" novalidate>
          <div style="grid-column:1/2"><label>Họ tên</label><input id="name" class="input" required></div>
          <div style="grid-column:2/3"><label>Email</label><input id="email" class="input" type="email" required></div>
          <div style="grid-column:1/2"><label>Số điện thoại</label><input id="phone" class="input" pattern="[0-9]{9,11}" required></div>
          <div style="grid-column:1/-1"><label>Địa chỉ</label><input id="addr" class="input" required></div>

          <div style="grid-column:1/-1;margin-top:8px" class="h3">Phương thức thanh toán</div>
          <div class="radio" style="grid-column:1/-1">
            <label><input type="radio" name="pay" value="cod" checked> COD (Thanh toán khi nhận hàng)</label>
            <label><input type="radio" name="pay" value="bank"> Chuyển khoản</label>
            <label><input type="radio" name="pay" value="card"> Thẻ (Visa/Master)</label>
          </div>

          <div class="row" style="grid-column:1/-1;justify-content:space-between;margin-top:8px">
            <a href="cart.html" class="btn">← Quay lại giỏ</a>
            <button class="btn primary" type="submit">Đặt hàng</button>
          </div>
          <div id="form-error" class="muted" style="color:#ef4444;display:none">Vui lòng điền đúng và đủ thông tin.</div>
        </form>
      </div>
    </section>

    <aside class="card summary">
      <div class="inner">
        <div class="h3">Tóm tắt</div>
        <div id="mini"></div>
        <hr/>
        <div class="row" style="gap:8px">
          <input id="voucher" class="input" placeholder="Nhập mã giảm giá (SALE10 / SALE50K / FREESHIP)" />
          <button id="apply" class="btn">Áp dụng</button>
        </div>
        <div class="code-hint">Mã mẫu: <b>SALE10</b>, <b>SALE50K</b>, <b>FREESHIP</b></div>
        <hr/>
        <ul>
          <li><span>Tạm tính</span><span id="sub">0₫</span></li>
          <li><span>Giảm giá</span><span id="discount">−0₫</span></li>
          <li><span>Phí vận chuyển</span><span id="ship">0₫</span></li>
          <li style="font-weight:800"><span>Tổng cộng</span><span id="total">0₫</span></li>
        </ul>
      </div>
    </aside>
  </div>
</main>

<script>
(() => {
  const BASE_URL = window.location.origin;
  const $ = s => document.querySelector(s);
  const money = n => (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('vi-VN',{style:'currency',currency:'VND'});

  function readCart(){try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch{return[]}}
  function updateBadge(){const t=readCart().reduce((s,it)=>s+(+it.qty||0),0);const el=$('#cartBadge');if(el)el.textContent=t?`Giỏ hàng (${t})`:'Giỏ hàng';}

  // ----- Render tóm tắt đơn hàng -----
  function renderSummary() {
    const cart = readCart();
    const listEl = $('#orderLines'); listEl.innerHTML = '';
    let subtotal = 0;
    cart.forEach(it => {
      const line = (Number(it.price)||0) * (Number(it.qty)||0);
      subtotal += line;
      const li = document.createElement('li');
      li.innerHTML = `<span>${it.name} x ${it.qty}</span><b>${money(line)}</b>`;
      listEl.appendChild(li);
    });
    const shipping = 30000; // tạm phí ship cố định
    const discount = 0;     // có thể đọc từ voucherCode nếu bạn implement
    const total = subtotal - discount + shipping;

    $('#sumSubtotal').textContent = money(subtotal);
    $('#sumShipping').textContent = money(shipping);
    $('#sumDiscount').textContent = discount ? ('- ' + money(discount)) : money(0);
    $('#sumTotal').textContent = money(total);
    return {subtotal, shipping, discount, total};
  }

  // ----- Submit order -----
  async function submitOrder(e){
    e.preventDefault();
    const cart = readCart();
    if (!cart.length) { alert('Giỏ hàng trống'); return; }

    const name = $('#name').value.trim();
    const phone = $('#phone').value.trim();
    const address = $('#address').value.trim();
    if (!name || !phone || !address) { alert('Vui lòng điền đầy đủ tên, SĐT, địa chỉ'); return; }

    const sums = renderSummary(); // đảm bảo đồng bộ
    const addressSnapshot = JSON.stringify({name, phone, address});
    const userId = Number(localStorage.getItem('userId')||0) || 0; // nếu chưa đăng nhập thì 0

    // Lưu ý: skuId dùng id sản phẩm nếu bạn chưa có bảng SKU riêng
    const items = cart.map(it => ({
      skuId: Number(it.id),
      qty: Number(it.qty),
      unitPrice: Number(it.price)||0
    }));

    const payload = {
      userId,
      status: "PENDING",
      subtotal: sums.subtotal,
      discount: sums.discount,
      shippingFee: sums.shipping,
      total: sums.total,
      addressSnapshot,
      note: $('#note').value || '',
      items
    };

    try {
      const res = await fetch(`${BASE_URL}/api/public/orders`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if (!res.ok){
        const t = await res.text();
        throw new Error(`HTTP ${res.status}: ${t}`);
      }
      const data = await res.json();
      // Clear cart, chuyển trang success
      localStorage.removeItem('cart');
      updateBadge();
      const oid = data?.orderId ?? '';
      window.location.href = `order-success.html?id=${encodeURIComponent(oid)}`;
    } catch(err){
      console.error(err);
      alert('Đặt hàng thất bại. Vui lòng thử lại!');
    }
  }

  // ----- Khởi tạo -----
  updateBadge();
  renderSummary();
  $('#checkoutForm')?.addEventListener('submit', submitOrder);
  window.addEventListener('storage', (e)=>{ if(e.key==='cart') renderSummary(); });
})();
</script>
<!-- auto-injected: auth core -->







<!-- core scripts (standardized) -->
<script src="assets/js/core/fetch-cred-patch.js"></script>
<script type="module" src="assets/js/core/auth.js"></script>
<script type="module" src="assets/js/core/header-auth.js"></script>
<script src="assets/js/core/dropdown-fix.js"></script>
<script src="assets/js/core/auth-menu-inject.js"></script>
<script src="assets/js/core/cart-guard.js"></script>
<script src="assets/js/core/compat-pid.js"></script>
<script src="assets/js/core/cart-badge.js"></script>
</body>
</html>
