<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đăng nhập — fonestore</title>
  
  <link rel="shortcut icon" href="#">

  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <style>
    .auth-wrap{min-height:calc(100vh - var(--header-h) - 120px);display:flex;align-items:center;justify-content:center}
    .auth-card{width:100%;max-width:520px}
    .auth-title{text-align:center;margin-bottom:12px}
    .auth-sub{color:var(--muted);text-align:center;margin-bottom:16px}
    .error-box{display:none;margin-top:16px;text-align:center;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:8px}

    /* --- CSS Căn chỉnh ô nhập mật khẩu và con mắt --- */
    .password-wrapper {
      position: relative;
      width: 100%;
    }
    
    .password-wrapper input {
      width: 100%;
      padding-right: 40px;
      box-sizing: border-box;
    }
    
    .btn-eye {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-top-right-radius: 8px; 
      border-bottom-right-radius: 8px;
    }
    
    .btn-eye:hover {
      color: var(--text);
      background-color: rgba(0,0,0,0.03);
    }
  </style>
  <link rel="stylesheet" href="assets/css/auth-menu.css"/>
  <script src="/assets/js/fs_compat.js"></script>
</head>
<body>
<header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại..." aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart">Giỏ hàng</a>
      <a href="login.html">Đăng nhập</a>
      <a href="help.html">Hỗ trợ</a>
    </nav>
  </div>
</header>

<main class="container section auth-wrap">
  <div class="card p-16 auth-card">
    <h1 class="h1 auth-title">Chào mừng trở lại</h1>
    <p class="auth-sub">Đăng nhập để theo dõi đơn hàng và mua sắm nhanh hơn</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      
      <div class="field mt-16">
        <label class="label" for="password">Mật khẩu</label>
        <div class="password-wrapper">
          <input id="password" class="input" type="password" placeholder="••••••••" minlength="6" autocomplete="current-password" required>
          
          <button type="button" id="toggle-password" class="btn-eye" tabindex="-1">
            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="icon-eye-off" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <button id="login-btn" class="btn btn-primary btn-block mt-24" type="submit">Đăng nhập</button>

      <div id="login-error" class="error-box"></div>
    </form>

    <p class="auth-sub" style="margin-top:16px">Chưa có tài khoản? <a href="register.html" style="text-decoration:underline">Đăng ký</a></p>
  </div>
</main>

<footer class="footer">
  <div class="container section">
    <div class="copyright">© 2025 fonestore — All rights reserved.</div>
  </div>
</footer>

<script>
(() => {
  /* --- Logic ẩn hiện mật khẩu --- */
  const toggleBtn = document.getElementById('toggle-password');
  const passInput = document.getElementById('password');
  const iconEye = toggleBtn.querySelector('.icon-eye');
  const iconOff = toggleBtn.querySelector('.icon-eye-off');

  toggleBtn.addEventListener('click', () => {
    const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passInput.setAttribute('type', type);
    
    if (type === 'text') {
      iconEye.style.display = 'none';
      iconOff.style.display = 'block';
    } else {
      iconEye.style.display = 'block';
      iconOff.style.display = 'none';
    }
  });

  /* --- Cấu hình API --- */
  const API_BASE = "http://localhost:9090";
  const LOGIN_ENDPOINT = `${API_BASE}/api/auth/login`;

  const elForm = document.getElementById('login-form');
  const elBtn  = document.getElementById('login-btn');
  const elErr  = document.getElementById('login-error');

  function notify(msg, type = 'error') {
    elErr.textContent = msg;
    elErr.style.display = 'block';

    if (type === 'success') {
      elErr.style.color = '#065f46';
      elErr.style.backgroundColor = '#d1fae5';
      elErr.style.border = '1px solid #a7f3d0';
    } else {
      elErr.style.color = '#b91c1c';
      elErr.style.backgroundColor = '#fef2f2';
      elErr.style.border = '1px solid #fecaca';
      
      if (msg.toLowerCase().includes('invalid email') || msg.toLowerCase().includes('bad credentials')) {
        elErr.textContent = 'Email hoặc mật khẩu không chính xác!';
      } else if (msg.toLowerCase().includes('disabled')) {
        elErr.textContent = 'Tài khoản này đã bị khóa!';
      } else if (msg.toLowerCase().includes('not found')) {
        elErr.textContent = 'Tài khoản không tồn tại!';
      }
    }
  }

  function pickToken(obj) {
    if (!obj) return null;
    if (obj.token) return obj.token;
    if (obj.accessToken) return obj.accessToken;
    if (obj.jwt) return obj.jwt;
    if (obj.data && (obj.data.token || obj.data.accessToken)) return obj.data.token || obj.data.accessToken;
    return null;
  }

  function canonicalSetToken(token) {
    try {
      if (typeof window.setToken === 'function') {
        window.setToken(token);
        return true;
      }
    } catch(e) { console.warn('canonicalSetToken error', e); }
    return false;
  }

  // Hàm setAuth đã bỏ tham số remember, mặc định là false
  function setAuth({ token, user } = {}) {
    if (!token) return;
    try {
      const did = canonicalSetToken(token);
      if (!did) {
        // Mặc định luôn dùng sessionStorage vì đã bỏ chức năng "Remember me"
        try { sessionStorage.setItem('fs_token', token); } catch(e){}
        try { sessionStorage.setItem('accessToken', token); } catch(e){}
        // Xóa sạch localStorage để tránh xung đột cũ
        try { localStorage.removeItem('fs_token'); } catch(e){}
        try { localStorage.removeItem('accessToken'); } catch(e){}
      }
    } catch(e) { console.warn('setAuth token store error', e); }

    try {
      sessionStorage.setItem('fs_user', JSON.stringify(user || {}));
      try { localStorage.removeItem('fs_user'); } catch(e){}
    } catch(e) { console.warn('setAuth user store error', e); }

    try {
      const uid = user && (user.userId || user.id || user.user_id) ? String(user.userId || user.id || user.user_id) : null;
      if (uid) {
        try { sessionStorage.setItem('fs_user_id', uid); } catch(e){}
        try { localStorage.removeItem('fs_user_id'); } catch(e){}
      } else {
        try { sessionStorage.removeItem('fs_user_id'); } catch(e){}
      }
    } catch(e){}

    try {
      ['fs_cart','cart','shopping_cart','cartItems'].forEach(k=>{
        try{ localStorage.removeItem(k); } catch(_) {}
        try{ sessionStorage.removeItem(k); } catch(_) {}
      });
    } catch(_){}

    try {
      window.dispatchEvent(new CustomEvent('fs:auth:login', { detail: { user } }));
      window.dispatchEvent(new CustomEvent('auth:changed', { detail: { user } }));
      window.dispatchEvent(new CustomEvent('login:success', { detail: user }));
      window.dispatchEvent(new CustomEvent('user:login', { detail: user }));
    } catch(e) { console.warn('emit events error', e); }
  }

  try {
    const hasToken = localStorage.getItem('fs_token') || sessionStorage.getItem('fs_token') ||
                     localStorage.getItem('accessToken') || sessionStorage.getItem('accessToken');
    if (hasToken) {
      window.location.replace('index.html');
      return;
    }
  } catch(e){}

  elForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    elErr.style.display = 'none'; 
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    // Đã xóa logic lấy giá trị checkbox remember

    if (!email) {
      notify('Vui lòng nhập địa chỉ Email!');
      document.getElementById('email').focus();
      return;
    }
    if (!password) {
      notify('Vui lòng nhập mật khẩu!');
      document.getElementById('password').focus();
      return;
    }

    elBtn.disabled = true; elBtn.textContent = 'Đang đăng nhập...';
    
    try {
      const res = await fetch(LOGIN_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (!res.ok) {
        let msg = '';
        try { 
            const jsonErr = await res.json();
            msg = jsonErr.message || jsonErr.error;
        } catch(_) { 
            try { msg = await res.text(); } catch(__){}
        }
        
        if (res.status === 401 || res.status === 403) {
             throw new Error('Invalid email or password'); 
        } else if (res.status === 404) {
             throw new Error('User not found');
        } else {
             throw new Error(msg || 'Đăng nhập thất bại. Vui lòng kiểm tra lại.');
        }
      }

      const data = await res.json().catch(()=> ({}));
      const token = pickToken(data);
      const user = data.user || (data.data && data.data.user) || null;

      if (!token) {
        console.warn('login response no token', data);
        throw new Error('Lỗi hệ thống: Server không trả về token.');
      }

      // Gọi setAuth không cần tham số remember nữa
      setAuth({ token, user });
      
      notify('Đăng nhập thành công!', 'success');
      
      setTimeout(()=> window.location.href = 'index.html', 800);

    } catch (err) {
      console.error('login error', err);
      notify(err.message || 'Có lỗi xảy ra. Vui lòng thử lại.');
      elBtn.disabled = false; elBtn.textContent = 'Đăng nhập';
    }
  });
})();
</script>

<script src="assets/js/core/fetch-cred-patch.js"></script>
<script type="module" src="assets/js/core/auth.js"></script>
<script type="module" src="assets/js/core/header-auth.js"></script>
<script src="assets/js/core/dropdown-fix.js"></script>
<script src="assets/js/core/auth-menu-inject.js"></script>
<script src="assets/js/core/cart-guard.js"></script>
<script src="assets/js/core/compat-pid.js"></script>
<script src="assets/js/core/cart-badge.js"></script>
</body>
</html>
