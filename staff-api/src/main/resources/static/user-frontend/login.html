<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Đăng nhập — fonestore</title>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <style>
    .auth-wrap{min-height:calc(100vh - var(--header-h) - 120px);display:flex;align-items:center;justify-content:center}
    .auth-card{width:100%;max-width:520px}
    .auth-title{text-align:center;margin-bottom:12px}
    .auth-sub{color:var(--muted);text-align:center;margin-bottom:16px}
    .error-box{display:none;margin-top:12px}
  </style>
  <link rel="stylesheet" href="assets/css/auth-menu.css"/>
   <script src="/assets/js/fs_compat.js"></script>
</head>
<body>
<header class="header">
  <div class="container inner">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="fonestore logo"><span>fonestore</span>
    </a>
    <div class="search"><input id="q" class="input" placeholder="Tìm điện thoại... (placeholder)" aria-label="Search"></div>
    <nav class="nav">
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html" class="badge badge-cart">Giỏ hàng</a>
      <a href="login.html">Đăng nhập</a>
      <a href="help.html">Hỗ trợ</a>
    </nav>
  </div>
</header>

<main class="container section auth-wrap">
  <div class="card p-16 auth-card">
    <h1 class="h1 auth-title">Chào mừng trở lại</h1>
    <p class="auth-sub">Đăng nhập để theo dõi đơn hàng và mua sắm nhanh hơn</p>

    <div id="login-error" class="alert error-box"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field mt-16">
        <label class="label" for="password">Mật khẩu</label>
        <input id="password" class="input" type="password" placeholder="••••••••" minlength="6" autocomplete="current-password" required>
      </div>
      <div class="row mt-16" style="justify-content:space-between;width:100%">
        <label class="row"><input id="remember" type="checkbox"> <span>Ghi nhớ tôi</span></label>
        <a class="muted" href="#">Quên mật khẩu?</a>
      </div>
      <button id="login-btn" class="btn btn-primary btn-block mt-24" type="submit">Đăng nhập</button>
    </form>

    <p class="auth-sub" style="margin-top:16px">Chưa có tài khoản? <a href="register.html" style="text-decoration:underline">Đăng ký</a></p>
  </div>
</main>

<footer class="footer">
  <div class="container section">
    <div class="copyright">© 2025 fonestore — All rights reserved.</div>
  </div>
</footer>

<script>
(() => {
  const API_BASE = "http://localhost:9090";
  const LOGIN_ENDPOINT = `${API_BASE}/api/auth/login`;

  const elForm = document.getElementById('login-form');
  const elBtn  = document.getElementById('login-btn');
  const elErr  = document.getElementById('login-error');

  // Utility: try parse various response shapes to extract token
  function pickToken(obj) {
    if (!obj) return null;
    // direct shapes
    if (obj.token) return obj.token;
    if (obj.accessToken) return obj.accessToken;
    if (obj.jwt) return obj.jwt;
    // nested: { data: { token: ... } }
    if (obj.data && (obj.data.token || obj.data.accessToken)) return obj.data.token || obj.data.accessToken;
    // sometimes axios style: { data: { user, token } }
    return null;
  }

  // canonical setter used by other modules (auth.js may define)
  function canonicalSetToken(token) {
    try {
      if (typeof window.setToken === 'function') {
        window.setToken(token);
        return true;
      }
    } catch(e) { console.warn('canonicalSetToken error', e); }
    return false;
  }

  // Improved setAuth: save token + user, fire events, add debug logs
  function setAuth({ token, user } = {}, remember = false) {
    if (!token) return;
    try {
      // try canonical setter first (auth.js)
      const did = canonicalSetToken(token);
      if (!did) {
        const storage = remember ? localStorage : sessionStorage;
        const alt = remember ? sessionStorage : localStorage;
        // save token in both common keys used by app
        try { storage.setItem('fs_token', token); } catch(e){}
        try { storage.setItem('accessToken', token); } catch(e){}
        // remove old token from alternative storage
        try { alt.removeItem('fs_token'); } catch(e){}
        try { alt.removeItem('accessToken'); } catch(e){}
      }
    } catch(e) {
      console.warn('setAuth token store error', e);
    }

    try {
      const storageUser = remember ? localStorage : sessionStorage;
      storageUser.setItem('fs_user', JSON.stringify(user || {}));
      // keep fs_user in both storages for compatibility
      try { localStorage.setItem('fs_user', JSON.stringify(user || {})); } catch(e){}
      try { sessionStorage.setItem('fs_user', JSON.stringify(user || {})); } catch(e){}
    } catch(e) {
      console.warn('setAuth user store error', e);
    }

    try {
      // explicit user id convenience keys
      const uid = user && (user.userId || user.id || user.user_id) ? String(user.userId || user.id || user.user_id) : null;
      if (uid) {
        try { localStorage.setItem('fs_user_id', uid); } catch(e){}
        try { sessionStorage.setItem('fs_user_id', uid); } catch(e){}
      } else {
        try { localStorage.removeItem('fs_user_id'); sessionStorage.removeItem('fs_user_id'); } catch(e){}
      }
    } catch(e){}

    // clear guest cart caches
    try {
      ['fs_cart','cart','shopping_cart','cartItems'].forEach(k=>{
        try{ localStorage.removeItem(k); } catch(_) {}
        try{ sessionStorage.removeItem(k); } catch(_) {}
      });
    } catch(_){}

    // emit events so other modules (cart-badge, header-auth, etc.) update
    try {
      window.dispatchEvent(new CustomEvent('fs:auth:login', { detail: { user } }));
      window.dispatchEvent(new CustomEvent('auth:changed', { detail: { user } }));
      // older listeners may expect login:success
      window.dispatchEvent(new CustomEvent('login:success', { detail: user }));
      // compatible custom alias
      window.dispatchEvent(new CustomEvent('user:login', { detail: user }));
    } catch(e) {
      console.warn('emit events error', e);
    }

    console.debug('setAuth done, tokenLen=', token ? token.length : 0, 'uid=', user ? (user.userId||user.id) : null);
  }

  // quick check on page load: if logged in -> redirect away
  try {
    const hasToken = localStorage.getItem('fs_token') || sessionStorage.getItem('fs_token') ||
                     localStorage.getItem('accessToken') || sessionStorage.getItem('accessToken');
    if (hasToken) {
      // optional: you could ping /api/auth/me to confirm, but redirect for now
      window.location.replace('index.html');
      return;
    }
  } catch(e){}

  elForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    elErr.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    if (!email || !password) {
      elErr.textContent = 'Vui lòng nhập email và mật khẩu.'; elErr.style.display = '';
      return;
    }

    elBtn.disabled = true; elBtn.textContent = 'Đang đăng nhập...';
    try {
      const res = await fetch(LOGIN_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (!res.ok) {
        // try parse json error first
        let msg = '';
        try { const txt = await res.text(); msg = txt || msg; } catch(_) {}
        throw new Error(msg || 'Đăng nhập thất bại. Vui lòng kiểm tra thông tin.');
      }

      const data = await res.json().catch(()=> ({}));
      const token = pickToken(data);
      // sometimes backend returns { user: {...}, token: '...' } or { token: '...', user: {...} }
      const user = data.user || (data.data && data.data.user) || null;

      if (!token) {
        // debug: show whole response to console to inspect shape
        console.warn('login response no token, response=', data);
        throw new Error('Phản hồi từ server không có token (kiểm tra server).');
      }

      setAuth({ token, user }, remember);
      // small delay to allow other scripts to react if needed
      setTimeout(()=> window.location.href = 'index.html', 80);
    } catch (err) {
      console.error('login error', err);
      elErr.textContent = err.message || 'Có lỗi xảy ra. Vui lòng thử lại.';
      elErr.style.display = '';
      elBtn.disabled = false; elBtn.textContent = 'Đăng nhập';
    }
  });
})();
</script>

<!-- auto-injected: auth core -->
<!-- auth.js phải load TRƯỚC -->
<!-- header-auth phụ thuộc vào auth.js -->
<!-- core scripts (standardized) -->
<script src="assets/js/core/fetch-cred-patch.js"></script>
<script type="module" src="assets/js/core/auth.js"></script>
<script type="module" src="assets/js/core/header-auth.js"></script>
<script src="assets/js/core/dropdown-fix.js"></script>
<script src="assets/js/core/auth-menu-inject.js"></script>
<script src="assets/js/core/cart-guard.js"></script>
<script src="assets/js/core/compat-pid.js"></script>
<script src="assets/js/core/cart-badge.js"></script>
</body>
</html>
