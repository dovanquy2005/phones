<!doctype html>
<html lang="vi">
<head>

  <link rel="stylesheet" href="css/base.css"/>

<body>
  <header class="app-header">

      <img src="assets/logo.svg" alt="" class="brand__logo"/>

    <form class="search" role="search" aria-label="Tìm kiếm">

      </span>

    <div class="header-actions">
      <a class="btn btn--primary" href="products.html#modal-create">Tạo mới</a>

        <summary class="avatar" aria-label="Tài khoản">

        </summary>
        <nav class="dropdown" aria-label="Tài khoản">
          <a href="settings.html">Cài đặt</a>
          <a href="auth-login.html">Đăng xuất</a>
        </nav>
      </details>
    </div>
  </header>

  <div class="app-shell">
        <aside class="sidebar" aria-label="Điều hướng">
      <div class="sidebar__group">
        <p class="sidebar__heading">Bán hàng</p>

      </div>
      <div class="sidebar__group">

        <h1 class="page-title">Thương hiệu</h1>

        <div class="card__body table-wrap">
          <table class="table">

            <tbody>
              
<tr><td>Apple</td><td>APPLE</td></tr>
<tr><td>Samsung</td><td>SAMSUNG</td></tr>
<tr><td>Xiaomi</td><td>XIAOMI</td></tr>
<tr><td>OPPO</td><td>OPPO</td></tr>
