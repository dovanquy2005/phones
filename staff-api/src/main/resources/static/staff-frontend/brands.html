<script>
/* ------------------ Brands page script (consolidated) ------------------ */

/* ===== Toast helper ===== */
function showToast(message, type='success', title){
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.innerHTML = `
    <div>
      <div class="toast__title">${title || (type==='success' ? 'Thành công' : 'Lỗi')}</div>
      <div class="toast__msg">${message || ''}</div>
    </div>`;
  root.appendChild(el);
  const timeout = setTimeout(()=> el.remove(), 2500);
  el.addEventListener('click', ()=>{ clearTimeout(timeout); el.remove(); });
}

/* ===== Small helpers ===== */
const qs = s => document.querySelector(s);
const show = (el)=>{ el?.setAttribute('aria-hidden','false'); };
const hide = (el)=>{ el?.setAttribute('aria-hidden','true'); };

function el(tag, attrs, text){
  const e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
  if (text !== undefined) e.textContent = text;
  return e;
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; });
}

/* ===== API logic ===== */
const API_BASE   = location.origin;
const API_BRANDS = API_BASE + '/api/brands';

const getToken = () => localStorage.getItem('accessToken') || '';
if (!getToken()) {
  // nếu trang này bắt buộc đăng nhập, redirect
  try { location.href = '/staff-frontend/auth-login.html'; } catch(e){}
}

async function apiFetch(url, opts={}){
  const headers = new Headers(opts.headers || {});
  const token = getToken();
  if (token) headers.set('Authorization', 'Bearer ' + token);
  if (opts.body && !(opts.body instanceof FormData) && !headers.has('Content-Type')){
    headers.set('Content-Type','application/json');
  }
  const res = await fetch(url, {...opts, headers});
  if (!res.ok){
    let detail=''; try{ const j=await res.json(); detail=j.message||j.error||''; }catch{}
    if (res.status===401){
      alert('Phiên đăng nhập hết hạn');
      localStorage.removeItem('accessToken');
      try { location.href='/staff-frontend/auth-login.html'; } catch(e){}
    }
    throw new Error(`HTTP ${res.status}${detail?': '+detail:''}`);
  }
  return res.status===204 ? null : res.json();
}

/* ===== Data & Pagination config ===== */
let allBrands = [];
const ROWS_PER_PAGE = 5; // tối đa 5 dòng / trang
let currentPage = 1;
let filteredList = [];
let totalPages = 1;

/* ----------------- Pagination + rendering ----------------- */

// renderPage: render 1 page of given list
function renderPage(list, page = 1){
  filteredList = Array.isArray(list) ? list : (Array.isArray(allBrands) ? allBrands : []);
  totalPages = Math.max(1, Math.ceil(filteredList.length / ROWS_PER_PAGE));
  currentPage = Math.min(Math.max(1, page), totalPages);

  const start = (currentPage - 1) * ROWS_PER_PAGE;
  const pageSlice = filteredList.slice(start, start + ROWS_PER_PAGE);

  const tb = qs('#rows-brands');
  if (!tb) return;
  if (!pageSlice.length){
    tb.innerHTML = `<tr><td colspan="2" class="empty">${filteredList.length ? 'Không có mục trên trang này' : 'Chưa có thương hiệu'}</td></tr>`;
  } else {
    tb.innerHTML = pageSlice.map(b => `
      <tr>
        <td>${escapeHtml(b.name ?? '')}</td>
        <td class="td-actions" style="text-align:right">
          <button class="btn btn--danger btn--sm" data-del="${b.id ?? b.brandId}">Xóa</button>
        </td>
      </tr>`).join('');
  }

  renderPaginationControls();
  updatePaginationInfo();
}

// legacy wrapper for backward compatibility
function renderRows(list, page=1){
  const useList = Array.isArray(list) ? list : allBrands;
  renderPage(useList, page);
}

function renderPaginationControls(){
  const root = qs('#pagination-controls');
  if (!root) return;
  root.innerHTML = '';

  // Prev page (single arrow)
  const btnPrev = el('button', { class:'pager-btn pager-btn--ghost', 'aria-label':'Trang trước', title:'Trang trước' }, '‹‹');
  btnPrev.addEventListener('click', ()=> handleGoToPage(Math.max(1, currentPage - 1)));
  root.appendChild(btnPrev);

  // page numbers: show intelligent window (max 7 items)
  const maxButtons = 7;
  let startPage = 1, endPage = totalPages;
  if (totalPages > maxButtons){
    const half = Math.floor(maxButtons/2);
    startPage = Math.max(1, currentPage - half);
    endPage = startPage + maxButtons - 1;
    if (endPage > totalPages){ endPage = totalPages; startPage = totalPages - maxButtons + 1; }
  }

  if (startPage > 1){
    root.appendChild(pageButton(1));
    if (startPage > 2) root.appendChild(el('span', { style:'padding:0 6px;color:#94a3b8' }, '…'));
  }

  for (let p = startPage; p <= endPage; p++){
    root.appendChild(pageButton(p));
  }

  if (endPage < totalPages){
    if (endPage < totalPages - 1) root.appendChild(el('span', { style:'padding:0 6px;color:#94a3b8' }, '…'));
    root.appendChild(pageButton(totalPages));
  }

  // Next page (single arrow)
  const btnNext = el('button', { class:'pager-btn pager-btn--ghost', 'aria-label':'Trang sau', title:'Trang sau' }, '››');
  btnNext.addEventListener('click', ()=> handleGoToPage(Math.min(totalPages, currentPage + 1)));
  root.appendChild(btnNext);

  // disable prev/next when not applicable
  if (currentPage === 1){
    btnPrev.disabled = true;
    btnPrev.classList.add('disabled');
  }
  if (currentPage === totalPages){
    btnNext.disabled = true;
    btnNext.classList.add('disabled');
  }

  function pageButton(p){
    const btn = el('button', { class:'pager-btn', 'aria-label':`Trang ${p}`, 'data-page':p }, String(p));
    if (p === currentPage){ btn.classList.add('active'); btn.setAttribute('aria-current','page'); }
    btn.addEventListener('click', ()=> handleGoToPage(p));
    return btn;
  }
}


function updatePaginationInfo(){
  const info = qs('#pagination-info');
  if (!info) return;
  const totalItems = filteredList.length ?? 0;
  info.textContent = `Trang ${currentPage}/${totalPages} · Tổng ${totalItems}`;
}
function handleGoToPage(page){
  page = Number(page) || 1;
  if (page < 1) page = 1;
  if (page > totalPages) page = totalPages;
  renderPage(filteredList.length ? filteredList : allBrands, page);
}

/* ----------------- CRUD operations ----------------- */
const createBrand = (b)=> apiFetch(API_BRANDS, {method:'POST', body: JSON.stringify(b)});
const deleteBrand = (id)=> apiFetch(`${API_BRANDS}/${encodeURIComponent(id)}`, {method:'DELETE'});

async function loadBrands(){
  const tb = qs('#rows-brands');
  if (tb) tb.innerHTML = `<tr><td colspan="2" class="empty">Đang tải…</td></tr>`;
  const raw = await apiFetch(API_BRANDS);
  const arr = Array.isArray(raw) ? raw
           : Array.isArray(raw?.content) ? raw.content
           : Array.isArray(raw?.items) ? raw.items : [];
  allBrands = arr.map(x => ({
    id: x.id ?? x.brandId ?? null,
    name: x.name ?? x.brandName ?? ''
  }));
  allBrands.sort((a,b)=> a.name.localeCompare(b.name,'vi',{sensitivity:'base'}));
  renderPage(allBrands,1);
}

/* ----------------- DOM ready & handlers ----------------- */
document.addEventListener('DOMContentLoaded', async ()=>{

  // logout handler (if exists)
  qs('#btn-logout')?.addEventListener('click', ()=> localStorage.removeItem('accessToken'));

  // load list (catch errors)
  try{
    await loadBrands();
  }catch(err){
    console.error(err);
    const tb = qs('#rows-brands');
    if (tb) tb.innerHTML = `<tr><td colspan="2" class="empty">Lỗi tải: ${escapeHtml(err.message)}</td></tr>`;
  }

  // modal & create form
  const modal = qs('#modal-create');
  const errEl = qs('#b-err');
  const nameEl = qs('#b-name');

  qs('#btn-open-create')?.addEventListener('click', ()=>{
    if (errEl){ errEl.style.display='none'; errEl.textContent=''; }
    if (nameEl) nameEl.value='';
    show(modal);
    setTimeout(()=> nameEl?.focus(),50);
  });
  const closeModal = ()=> hide(modal);
  qs('#btn-close')?.addEventListener('click', closeModal);
  qs('#btn-cancel')?.addEventListener('click', closeModal);

  qs('#form-create')?.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if (errEl){ errEl.style.display='none'; errEl.textContent=''; }
    const name = nameEl?.value.trim() || '';
    if (!name){ if (errEl){ errEl.textContent='Vui lòng nhập tên thương hiệu'; errEl.style.display='block'; } return; }

    const dup = allBrands.find(b => b.name.toLowerCase()===name.toLowerCase());
    if (dup){ if (errEl){ errEl.textContent='Thương hiệu đã tồn tại'; errEl.style.display='block'; } return; }

    try{
      const created = await createBrand({ name });
      allBrands.push({ id: created?.id ?? created?.brandId ?? null, name: created?.name ?? name });
      allBrands.sort((a,b)=> a.name.localeCompare(b.name,'vi',{sensitivity:'base'}));
      const newTotalPages = Math.max(1, Math.ceil(allBrands.length / ROWS_PER_PAGE));
      const nextPage = Math.min(currentPage, newTotalPages);
      renderPage(allBrands, nextPage);
      closeModal();
      showToast('Đã thêm thương hiệu mới.', 'success');
    }catch(err){
      if (errEl){ errEl.textContent='Lỗi tạo mới: '+err.message; errEl.style.display='block'; }
      showToast('Lỗi khi tạo thương hiệu: '+err.message, 'error');
    }
  });

  // delete (delegated)
  document.addEventListener('click', async (e)=>{
    const del = e.target.closest('[data-del]');
    if (!del) return;
    if (!confirm('Xóa thương hiệu này?')) return;
    const id = del.dataset.del;
    try{
      await deleteBrand(id);
      allBrands = allBrands.filter(b => String(b.id)!==String(id));
      allBrands.sort((a,b)=> a.name.localeCompare(b.name,'vi',{sensitivity:'base'}));
      const newTotalPages = Math.max(1, Math.ceil(allBrands.length / ROWS_PER_PAGE));
      const nextPage = Math.min(currentPage, newTotalPages);
      renderPage(allBrands, nextPage);
      showToast('Đã xóa thương hiệu.', 'success');
    }catch(err){
      showToast('Xóa thất bại: '+err.message, 'error');
    }
  });

  // search/filter (if #q exists)
  const qEl = qs('#q');
  if (qEl){
    qEl.addEventListener('input',(e)=>{
      const q = e.target.value.trim().toLowerCase();
      const list = !q ? allBrands : allBrands.filter(b=>b.name.toLowerCase().includes(q));
      renderPage(list, 1); // khi filter về trang 1
    });
  }
});

/* ------------------ End of brands script ------------------ */
</script>

<script>
// START: unified header js
(function(){
  const getToken = () =>
    (typeof window.getToken === 'function' ? window.getToken() : localStorage.getItem('accessToken') || '');

  function decodeJwt(token){
    try{
      const p = token.split('.')[1];
      const json = atob(p.replace(/-/g,'+').replace(/_/g,'/'));
      return JSON.parse(decodeURIComponent(escape(json)));
    }catch{ return null; }
  }

  function pickRole(payload){
    const arr = payload?.authorities || payload?.roles || payload?.scope || [];
    const list = Array.isArray(arr) ? arr.map(String) : String(arr||'').split(/\s+/);
    if (list.find(v => v.toLowerCase()==='manager')) return 'manager';
    if (list.find(v => v.toLowerCase()==='staff'))   return 'staff';
    if (list.find(v => v.toLowerCase()==='user'))    return 'user';
    return '—';
  }

  function initials(s){
    const t = (s||'').trim(); if(!t) return '--';
    const parts = t.split(/\s+/);
    const a = (parts[0]||'')[0]||'', b = (parts[parts.length-1]||'')[0]||'';
    return (a+b || t.slice(0,2)).toUpperCase();
  }

  function fillProfile({name,email,role}){
    const avHeader = document.getElementById('avatarImg');
    if (avHeader) avHeader.src = `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(initials(name))}`;

    const av = document.getElementById('profileAvatar');
    if (av) av.src = `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(initials(name))}`;
    const n1 = document.getElementById('profileName');  if (n1) n1.textContent = name;
    const r1 = document.getElementById('profileRole');
    if (r1){
      r1.textContent = role==='manager'?'Manager':(role==='staff'?'Staff':role);
      r1.className = 'role-badge ' + (role==='manager'?'manager':(role==='staff'?'staff':''));
    }
    const iN = document.getElementById('profile_name'); if (iN) iN.value = name;
    const iE = document.getElementById('profile_email');if (iE) iE.value = email;
    const iR = document.getElementById('profile_role'); if (iR) iR.value = r1 ? r1.textContent : role;
  }

  function renderUser(){
    const token = getToken(); if (!token) return;
    const payload = decodeJwt(token) || {};
    const name  = payload.name || payload.fullName || payload.given_name || payload.sub || 'Người dùng';
    const email = payload.email || payload.username || '—';
    const role  = pickRole(payload);
    fillProfile({name,email,role});
  }

  // Ensure logout link clears token
  document.getElementById('btn-logout')?.addEventListener('click', ()=>{
    localStorage.removeItem('accessToken');
  });

  renderUser();
})();
// END: unified header js
</script>
<script>
// START: role-based sidebar control (robust)
function __extractRoles(payload){
  try{
    let raw = payload?.authorities ?? payload?.roles ?? payload?.role ?? payload?.scope ?? [];
    let list = Array.isArray(raw) ? raw : String(raw||'').split(/[,\s]+/);
    list = list
      .map(x => (x && typeof x === 'object' && x.authority) ? x.authority : x) // support [{authority:"ROLE_MANAGER"}]
      .map(s => String(s||'').trim().toLowerCase().replace(/^role[_:\-]/, ''));
    return list.filter(Boolean);
  }catch(e){ return []; }
}
function __deriveRole(list){
  if (list.includes('manager') || list.includes('admin') || list.includes('administrator')) return 'manager';
  if (list.includes('staff') || list.includes('employee')) return 'staff';
  if (list.includes('user')) return 'user';
  return list[0] || 'user';
}
function __applyRoleUI(role){
  try{
    const sys = document.querySelector('.sidebar__group[data-sec="system"]');
    if (sys && role !== 'manager') {
      sys.remove();
    }
  }catch(e){}
}
// END: role-based sidebar control (robust)
</script>

<script>
(function(){
  const menu = document.querySelector('.avatar-menu') || document.getElementById('avatarMenu');
  if (!menu) return;
  const dropdown = menu.querySelector('.dropdown');
  const summary = menu.querySelector('summary') || menu.querySelector('.avatar');
  if (!dropdown || !summary) return;

  function placeDropdown(){
    const r = summary.getBoundingClientRect();
    const ddw = dropdown.offsetWidth || 200;
    let left = Math.min(Math.max(8, r.right - ddw), window.innerWidth - ddw - 8);
    dropdown.style.position = 'fixed';
    dropdown.style.top = (r.bottom + 8) + 'px';
    dropdown.style.left = left + 'px';
  }

  menu.addEventListener('toggle', ()=> menu.open && placeDropdown() );
  window.addEventListener('resize', placeDropdown);
  window.addEventListener('scroll', placeDropdown, true);
  summary.addEventListener('click', ()=> setTimeout(placeDropdown, 10));
})();
</script>
