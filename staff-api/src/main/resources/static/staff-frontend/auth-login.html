<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>fonestore · Đăng nhập</title>
  <link rel="stylesheet" href="css/base.css"/>
  <style>
    .auth{min-height:100vh; display:grid; place-items:center; padding:20px}
    .auth-card{background:#fff; border:1px solid var(--color-border); border-radius:16px; width:min(420px,100%); box-shadow:var(--shadow-md)}
    .auth-card .brand{display:flex; gap:8px; align-items:center; justify-content:center; padding:18px 0; border-bottom:1px solid var(--color-border)}
    .card__body{padding:20px}
    .field{display:flex; flex-direction:column; gap:6px; margin:10px 0}
    .input{height:40px; border:1px solid var(--color-border); border-radius:10px; padding:0 12px}
    .actions{display:flex; justify-content:space-between; align-items:center; margin-top:14px}
    .btn{display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 14px; border-radius:10px; border:1px solid transparent; cursor:pointer}
    .btn--primary{background:#111827; color:#fff}
    .msg{margin-top:10px; font-size:14px}
    .msg--error{color:#b91c1c}
    .msg--ok{color:#065f46}
  </style>
</head>
<body>
  <div class="auth">
    <section class="auth-card">
      <div class="brand">
        <img src="assets/logo.svg" class="brand__logo" alt="" width="24" height="24"/>
        <span class="brand__text">fonestore</span>
      </div>

      <div class="card__body">
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="input" placeholder="you@brand.com" required/>
          </div>

          <div class="field">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" class="input" placeholder="••••••••" required/>
          </div>

          <div class="actions">
            <button id="btnSubmit" class="btn btn--primary" type="submit">Đăng nhập</button>
            <a href="auth-forgot.html">Quên mật khẩu?</a>
          </div>

          <div id="msg" class="msg" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </div>

  <script>
  const setToken = (t) => t && localStorage.setItem("accessToken", t);
  const setUser  = (u) => localStorage.setItem("staffUser", JSON.stringify(u||{}));
  const $ = (s) => document.querySelector(s);
  const form = $("#loginForm");
  const msg  = $("#msg");
  const btn  = $("#btnSubmit");

  function showMsg(text, ok=false){
    msg.textContent = text || "";
    msg.className = "msg " + (ok ? "msg--ok" : "msg--error");
  }

  // ✅ GỌI ĐÚNG STAFF LOGIN
  async function staffLogin(email, password){
    const res = await fetch("/api/auth/staff/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) {
      let detail = "";
      try { const j = await res.json(); detail = j.message || j.error || ""; } catch {}
      const err = new Error(`HTTP ${res.status}${detail?": "+detail:""}`);
      err.status = res.status;
      throw err;
    }
    return res.json(); // { userId, email, role, twofaEnabled, token }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    showMsg("");
    const email    = $("#email").value.trim();
    const password = $("#password").value;

    if (!email || !password){
      showMsg("Vui lòng nhập email và mật khẩu."); return;
    }

    btn.disabled = true; btn.textContent = "Đang đăng nhập…";
    try {
      const data = await staffLogin(email, password);

      // role trả về là "staff" hoặc "manager"
      const role = (data.role || "").toLowerCase();
      if (role !== "staff" && role !== "manager") {
        showMsg("Tài khoản không có quyền STAFF hoặc MANAGER.");
        btn.disabled = false; btn.textContent = "Đăng nhập"; return;
      }

      setToken(data.token); // staff login trả 'token'
      setUser({ userId: data.userId, email: data.email, role: data.role });

      showMsg("Đăng nhập thành công!", true);
      window.location.href = "/staff-frontend/products.html";
    } catch (err) {
      showMsg("Đăng nhập thất bại: " + (err.message || "Lỗi không xác định"));
      btn.disabled = false; btn.textContent = "Đăng nhập";
    }
  });
</script>

</body>
</html>
