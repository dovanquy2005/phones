<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>fonestore · Đơn hàng</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="icon" href="/user-frontend/assets/img/logo.svg" type="image/svg+xml">
  <style>
    :root{
      --ink:#0f172a;--muted:#6b7280;--border:#e5e7eb;--brand:#111827;
      --pill:#eef2ff;--radius:10px;
    }
    .table{width:100%;border-collapse:collapse;table-layout:fixed;}
    .table thead th,.table tbody td{padding:12px 16px;border-bottom:1px solid var(--color-border, #e5e7eb)}
    .table-wrap{overflow-x:auto;}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .page-title{margin:0}
    .order-filters{display:flex;gap:8px;flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-weight:500}
    .chip.is-active{background:#111827;color:#fff;border-color:#111827}
    .badge{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border-radius:999px;cursor:pointer;user-select:none}
    .badge--success{background:#dcfce7;color:#166534}
    .badge--warn{background:#fff7ed;color:#9a3412}
    .badge--danger{background:#fee2e2;color:#991b1b}
    .badge--neutral{background:#e0e7ff;color:#3730a3}
    .td-actions{display:flex;justify-content:flex-end}
    .empty{padding:16px;color:#6b7280;text-align:center;}
    .grid{display:grid;gap:12px}
    .grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
    @media (max-width:720px){ .grid--2{grid-template-columns:1fr} }

    /* Search inline (ở body) */
    .search-inline{
      display:flex;align-items:center;gap:8px;margin:8px 0 12px;
      background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;
    }
    .search-inline input{flex:1;border:none;outline:none;background:transparent;font-size:14px}

    /* Inline status editor */
    .status-cell{position:relative;display:flex;align-items:center;gap:8px}
    .status-view{display:inline-flex;align-items:center;gap:6px}
    .status-select{
      display:none;
      position:absolute; top:50%; transform:translateY(-50%);
      left:0; z-index:2;
      border:1px solid #e5e7eb; border-radius:8px; background:#fff;
      padding:6px 8px; font-size:14px; box-shadow:0 8px 28px rgba(0,0,0,.08);
      min-width:170px;
    }
    .status-cell.is-editing .status-select{display:block}

    /* Toggle caret button (tam giác) */
    .status-toggle{
      display:inline-flex;align-items:center;justify-content:center;
      width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;
    }
    .status-toggle svg{width:14px;height:14px;transition:transform .15s ease}
    .status-cell.is-editing .status-toggle svg{transform:rotate(180deg)}

    /* Pagination */
    .pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:12px 8px;border-top:1px solid var(--border)}
    .pager .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
    .pager .btn[disabled]{opacity:.45;cursor:not-allowed}
    .pager .page{min-width:34px;text-align:center}
    .pager .is-active{background:#111827;color:#fff;border-color:#111827}

    /* Toast + aria live */
    .toast{
      position:fixed;right:16px;bottom:16px;z-index:50;background:#111827;color:#fff;
      padding:10px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;
      transform:translateY(8px);transition:opacity .2s ease, transform .2s ease;
      font-size:14px
    }
    .toast.show{opacity:1;pointer-events:auto;transform:translateY(0)}
  
/* START: unified header css */
.app-header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #e5e7eb;background:#fff}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.header-spacer{flex:1}
.header-actions{display:flex;align-items:center;gap:10px}
.avatar-menu{position:relative}
.avatar-menu > summary{list-style:none;cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;border:1px solid #e5e7eb;display:inline-block}
.avatar img{width:100%;height:100%;display:block}
.avatar-menu[open] .dropdown{display:block}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);min-width:180px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:6px;display:none;z-index:50}
.dropdown a{display:block;padding:8px 10px;border-radius:8px;color:#111827;text-decoration:none;font-size:14px}
.dropdown a:hover{background:#f3f4f6}
.role-badge{font-size:12px;padding:2px 8px;border-radius:999px}
.role-badge.manager{background:#dcfce7;color:#166534}
.role-badge.staff{background:#fee2e2;color:#991b1b}
/* END: unified header css */
</style>
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" aria-label="Điều hướng">

      <p class="sidebar__heading">Hàng hóa</p>

<a class="sidebar__link sidebar__link--active" href="staff.html">Nhân viên</a>

  <main class="content">

      <h1 class="page-title">Đơn hàng</h1>

    <!-- Ô tìm kiếm -->
    <div class="search-inline" role="search" aria-label="Tìm kiếm đơn hàng">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">

<!-- Toast + aria live -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="aria-live" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden" aria-live="polite"></div>

<script>
/* ===== Helpers ===== */
const API_BASE   = location.origin;
const API_ORDERS = API_BASE + '/api/orders';

const qs = s => document.querySelector(s);
const qsa = s => Array.from(document.querySelectorAll(s));
const fmtVND = n => (Number(n)||0).toLocaleString('vi-VN').replace(/,/g,'.') + '₫';
const fmtDate = s => {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  return `${dd}/${mm}/${yy}`;
};
function badgeHtml(status){
  switch((status||'').toUpperCase()){
    case 'PAID':     return '<span class="badge badge--success" title="Bấm để đổi trạng thái">Đã thanh toán</span>';
    case 'PENDING':  return '<span class="badge badge--warn"    title="Bấm để đổi trạng thái">Chờ giao</span>';
    case 'CANCELED': return '<span class="badge badge--danger"  title="Bấm để đổi trạng thái">Hủy</span>';
    case 'COD':      return '<span class="badge badge--neutral" title="Bấm để đổi trạng thái">COD</span>';
    case 'DELIVERED':return '<span class="badge badge--success" title="Bấm để đổi trạng thái">Đã giao</span>';
    case 'SHIPPING': return '<span class="badge badge--neutral" title="Bấm để đổi trạng thái">Đang giao</span>'; // hiển thị nếu dữ liệu cũ
    default:         return `<span class="badge" title="Bấm để đổi trạng thái">${status||'-'}</span>`;
  }
}
const getToken = () => localStorage.getItem('accessToken') || '';
if (!getToken()) location.href = '/staff-frontend/auth-login.html';

async function apiFetch(url, opts={}){
  const headers = new Headers(opts.headers || {});
  const token = getToken();
  if (token) headers.set('Authorization','Bearer '+token);
  if (opts.body && !(opts.body instanceof FormData) && !headers.has('Content-Type')){
    headers.set('Content-Type','application/json');
  }
  const res = await fetch(url,{...opts, headers});
  if (!res.ok){
    let detail=''; try{ const j=await res.json(); detail=j.message||j.error||''; }catch{}
    if (res.status===401){ alert('Phiên đăng nhập hết hạn'); localStorage.removeItem('accessToken'); location.href='/staff-frontend/auth-login.html'; }
    throw new Error(`HTTP ${res.status}${detail?': '+detail:''}`);
  }
  return res.status===204 ? null : res.json();
}

/* ===== State ===== */
let allOrders = [];
let filters = { status:'', from:null, to:null, q:'' };
let pagination = { page:1, perPage:10, totalPages:1 };

/* ===== Status options (KHÔNG có SHIPPING) ===== */
const STATUS_OPTIONS = [
  {value:'PENDING',  label:'Chờ giao'},
  {value:'DELIVERED',label:'Đã giao'},
  {value:'PAID',     label:'Đã thanh toán'},
  {value:'COD',      label:'COD'},
  {value:'CANCELED', label:'Hủy'}
];

/* ===== Toast/Live ===== */
let toastTimer=null;
function showToast(msg, timeout=1800){
  const t = qs('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), timeout);
  const live = qs('#aria-live'); // screen reader
  live.textContent = msg;
}

/* ===== Render ===== */
function renderRows(list){
  const tb = qs('#rows-orders');
  // paginate
  const total = list.length;
  pagination.totalPages = Math.max(1, Math.ceil(total / pagination.perPage));
  if (pagination.page > pagination.totalPages) pagination.page = pagination.totalPages;
  const start = (pagination.page - 1) * pagination.perPage;
  const end = start + pagination.perPage;
  const pageItems = list.slice(start, end);

  // summary text
  const startIdx = total ? start + 1 : 0;
  const endIdx = total ? Math.min(end, total) : 0;
  qs('#pager-summary').textContent = total
    ? `Hiển thị ${startIdx}–${endIdx} trong tổng ${total} đơn`
    : '';

  if (!pageItems.length){
    tb.innerHTML = `<tr><td colspan="6" class="empty">Không có đơn hàng</td></tr>`;
    renderPagination();
    return;
  }

  tb.innerHTML = pageItems.map(o=>{
    let customer = o.customerName || o.customer || '';
    if (!customer && typeof o.addressSnapshot === 'string'){
      try{ const snap = JSON.parse(o.addressSnapshot); customer = snap.name || ''; }catch{}
    }
    const code = o.code || `OD-${String(o.orderId ?? o.id).padStart(6,'0')}`;
    const total = fmtVND(o.total ?? (o.subtotal - (o.discount||0) + (o.shippingFee||0)));
    const date  = fmtDate(o.createdAt || o.created_at);
    const status= (o.status || '').toUpperCase();

    // nếu status hiện tại không có trong options (vd SHIPPING) -> default select là PENDING
    const selectedValue = STATUS_OPTIONS.some(s => s.value === status) ? status : 'PENDING';
    const options = STATUS_OPTIONS.map(s => `<option value="${s.value}" ${s.value===selectedValue?'selected':''}>${s.label}</option>`).join('');

    return `
      <tr data-row="${o.orderId ?? o.id}">
        <td>${code}</td>
        <td>${customer||'-'}</td>
        <td>${total}</td>
        <td class="status-cell">
          <div class="status-view">
            ${badgeHtml(status)}
            <button class="status-toggle" data-toggle="${o.orderId ?? o.id}" aria-label="Mở danh sách trạng thái">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <select class="status-select" data-id="${o.orderId ?? o.id}" aria-label="Chỉnh trạng thái">
            ${options}
          </select>
        </td>
        <td>${date}</td>
        <td class="td-actions">
          <button class="btn btn--sm" data-print="${o.orderId ?? o.id}">In hóa đơn</button>
        </td>
      </tr>
    `;
  }).join('');

  renderPagination();
}

function renderPagination(){
  const wrap = qs('#pager');
  const { page, totalPages } = pagination;

  // build page numbers (smart window)
  const pages = [];
  const maxBtns = 5;
  let start = Math.max(1, page - Math.floor(maxBtns/2));
  let end = start + maxBtns - 1;
  if (end > totalPages){ end = totalPages; start = Math.max(1, end - maxBtns + 1); }
  for (let i=start;i<=end;i++) pages.push(i);

  wrap.innerHTML = `
    <button class="btn" data-page="prev" ${page<=1?'disabled':''}>Prev</button>
    ${pages.map(p=>`<button class="btn page ${p===page?'is-active':''}" data-page="${p}">${p}</button>`).join('')}
    <button class="btn" data-page="next" ${page>=totalPages?'disabled':''}>Next</button>
  `;
}

/* ===== Load & Filter ===== */
async function loadOrders(){
  const tb = qs('#rows-orders');
  tb.innerHTML = `<tr><td colspan="6" class="empty">Đang tải…</td></tr>`;
  let url = API_ORDERS;
  const params = new URLSearchParams();
  if (filters.status) params.set('status', filters.status);
  if (filters.from) params.set('from', filters.from);
  if (filters.to) params.set('to', filters.to);
  if (filters.q) params.set('q', filters.q);
  if ([...params.keys()].length) url += `?${params.toString()}`;

  try{
    const raw = await apiFetch(url);
    const arr = Array.isArray(raw) ? raw
              : Array.isArray(raw?.content) ? raw.content
              : Array.isArray(raw?.items) ? raw.items : [];
    allOrders = arr.map(o=>({
      id: o.id ?? o.orderId,
      orderId: o.orderId ?? o.id,
      code: o.code,
      customerName: o.customerName,
      addressSnapshot: o.addressSnapshot ?? o.address_snapshot,
      status: (o.status||'').toUpperCase(),
      subtotal: o.subtotal,
      discount: o.discount,
      shippingFee: o.shippingFee ?? o.shipping_fee,
      total: o.total,
      createdAt: o.createdAt ?? o.created_at
    }));
    pagination.page = 1; // reset khi load mới
    renderRows(applyClientFilter(allOrders));
  }catch(err){
    console.error(err);
    tb.innerHTML = `<tr><td colspan="6" class="empty">Lỗi tải: ${err.message}</td></tr>`;
    qs('#pager').innerHTML = '';
    qs('#pager-summary').textContent = '';
  }
}

function applyClientFilter(src){
  const filtered = src.filter(o=>{
    const q = (filters.q||'').trim().toLowerCase();
    const inStatus = !filters.status || o.status===filters.status;
    const inQ = !q || (String(o.code||'').toLowerCase().includes(q) ||
                       String(o.customerName||'').toLowerCase().includes(q) ||
                       (typeof o.addressSnapshot==='string' && o.addressSnapshot.toLowerCase().includes(q)));
    let inDate = true;
    if (filters.from){ inDate = inDate && new Date(o.createdAt) >= new Date(filters.from+'T00:00:00'); }
    if (filters.to){   inDate = inDate && new Date(o.createdAt) <= new Date(filters.to+'T23:59:59'); }
    return inStatus && inQ && inDate;
  });
  return filtered;
}

/* ===== Status inline edit (KHÔNG dùng SHIPPING) ===== */
async function updateOrderStatus(orderId, newStatus) {
  const val = String(newStatus || '').trim().toUpperCase();
  if (!val) return;

  // chỉ cho phép các trạng thái hợp lệ (khớp DB)
  const allowed = new Set(STATUS_OPTIONS.map(s => s.value)); // PENDING, DELIVERED, PAID, COD, CANCELED
  if (!allowed.has(val)) {
    alert('Trạng thái không hợp lệ: ' + val);
    return;
  }

  // optimistic update
  const prev = allOrders.find(o => o.id == orderId)?.status;
  allOrders = allOrders.map(o => o.id == orderId ? { ...o, status: val } : o);
  renderRows(applyClientFilter(allOrders));

  try {
    // PATCH /api/orders/{id}/status  (BE yêu cầu { status })
    const updated = await apiFetch(`${location.origin}/api/orders/${orderId}/status`, {
      method: 'PATCH',
      body: JSON.stringify({ status: val })
    });

    // nếu BE trả về OrderDetailDTO thì đồng bộ lại local state
    if (updated && (updated.id || updated.orderId)) {
      const id = updated.id ?? updated.orderId;
      const status = (updated.status || val).toUpperCase();
      allOrders = allOrders.map(o => o.id == id ? { ...o, status } : o);
      renderRows(applyClientFilter(allOrders));
    }
  } catch (err) {
    // rollback khi lỗi
    allOrders = allOrders.map(o => o.id == orderId ? { ...o, status: prev } : o);
    renderRows(applyClientFilter(allOrders));
    alert('Cập nhật thất bại: ' + err.message);
  }
}

/* ===== Events ===== */
document.addEventListener('DOMContentLoaded', async ()=>{
  const logout = qs('#btn-logout'); logout?.addEventListener('click', ()=> localStorage.removeItem('accessToken'));

  // Chips trạng thái
  document.getElementById('status-chips').addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip'); if (!chip) return;
    qsa('#status-chips .chip').forEach(c=>c.classList.remove('is-active'));
    chip.classList.add('is-active');
    filters.status = chip.dataset.status || '';
    pagination.page = 1;
    renderRows(applyClientFilter(allOrders));
  });

  // Ngày
  document.getElementById('from-date').addEventListener('change', (e)=>{
    filters.from = e.target.value || null; pagination.page = 1; renderRows(applyClientFilter(allOrders));
  });
  document.getElementById('to-date').addEventListener('change', (e)=>{
    filters.to = e.target.value || null; pagination.page = 1; renderRows(applyClientFilter(allOrders));
  });

  // Tìm nhanh
  document.getElementById('q-body').addEventListener('input', (e)=>{
    filters.q = e.target.value || ''; pagination.page = 1; renderRows(applyClientFilter(allOrders));
  });

  // In hoá đơn
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-print]'); if (!btn) return;
    const id = btn.dataset.print;
    window.open(`/staff-frontend/invoice.html?orderId=${encodeURIComponent(id)}`,'_blank');
  });

  // Bấm badge không mở tự động nữa (giữ hành vi cũ nếu muốn)
  document.addEventListener('click', (e)=>{
    const cell = e.target.closest('.status-cell'); if (!cell) return;
    const toggleBtn = e.target.closest('.status-toggle');
    if (toggleBtn){
      // bật/tắt editor
      const wasOpen = cell.classList.contains('is-editing');
      qsa('.status-cell.is-editing').forEach(c=>c.classList.remove('is-editing'));
      if (!wasOpen){
        cell.classList.add('is-editing');
        const sel = cell.querySelector('.status-select');
        sel?.focus();
        showToast('Mở danh sách trạng thái — hãy chọn trạng thái mới');
      }
    }
  });

  // Chọn trạng thái mới
  document.addEventListener('change', async (e)=>{
    const sel = e.target.closest('.status-select'); if (!sel) return;
    const id  = sel.dataset.id;
    let val = sel.value;
    if (val === 'SHIPPING') val = 'PENDING';
    await updateOrderStatus(id, val);

    // đóng editor
    const cell = sel.closest('.status-cell');
    cell?.classList.remove('is-editing');
  });

  // Click ngoài để đóng dropdown
  document.addEventListener('click', (e)=>{
    qsa('.status-cell.is-editing').forEach(c=>{
      if (!c.contains(e.target)) c.classList.remove('is-editing');
    });
  });

  // Phân trang: prev/next/number
  document.getElementById('pager').addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-page]'); if (!btn) return;
    const val = btn.dataset.page;
    if (val === 'prev' && pagination.page > 1) pagination.page--;
    else if (val === 'next' && pagination.page < pagination.totalPages) pagination.page++;
    else if (!isNaN(+val)) pagination.page = +val;
    renderRows(applyClientFilter(allOrders));
  });

  await loadOrders();
});
</script>

<script>
// START: unified header js
(function(){
  const getToken = () =>
    (typeof window.getToken === 'function' ? window.getToken() : localStorage.getItem('accessToken') || '');

  function decodeJwt(token){
    try{
      const p = token.split('.')[1];
      const json = atob(p.replace(/-/g,'+').replace(/_/g,'/'));
      return JSON.parse(decodeURIComponent(escape(json)));
    }catch{ return null; }
  }

  function pickRole(payload){
    const arr = payload?.authorities || payload?.roles || payload?.scope || [];
    const list = Array.isArray(arr) ? arr.map(String) : String(arr||'').split(/\s+/);
    if (list.find(v => v.toLowerCase()==='manager')) return 'manager';
    if (list.find(v => v.toLowerCase()==='staff'))   return 'staff';
    if (list.find(v => v.toLowerCase()==='user'))    return 'user';
    return '—';
  }

  function initials(s){
    const t = (s||'').trim(); if(!t) return '--';
    const parts = t.split(/\s+/);
    const a = (parts[0]||'')[0]||'', b = (parts[parts.length-1]||'')[0]||'';
    return (a+b || t.slice(0,2)).toUpperCase();
  }

  function fillProfile({name,email,role}){
    const avHeader = document.getElementById('avatarImg');
    if (avHeader) avHeader.src = `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(initials(name))}`;

    const av = document.getElementById('profileAvatar');
    if (av) av.src = `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(initials(name))}`;
    const n1 = document.getElementById('profileName');  if (n1) n1.textContent = name;
    const r1 = document.getElementById('profileRole');
    if (r1){
      r1.textContent = role==='manager'?'Manager':(role==='staff'?'Staff':role);
      r1.className = 'role-badge ' + (role==='manager'?'manager':(role==='staff'?'staff':''));
    }
    const iN = document.getElementById('profile_name'); if (iN) iN.value = name;
    const iE = document.getElementById('profile_email');if (iE) iE.value = email;
    const iR = document.getElementById('profile_role'); if (iR) iR.value = r1 ? r1.textContent : role;
  }

  function renderUser(){
    const token = getToken(); if (!token) return;
    const payload = decodeJwt(token) || {};
    const name  = payload.name || payload.fullName || payload.given_name || payload.sub || 'Người dùng';
    const email = payload.email || payload.username || '—';
    const role  = pickRole(payload);
    fillProfile({name,email,role});
  }

  // Ensure logout link clears token
  document.getElementById('btn-logout')?.addEventListener('click', ()=>{
    localStorage.removeItem('accessToken');
  });

  renderUser();
})();
// END: unified header js
</script>
<script>
// START: role-based sidebar control (robust)
function __extractRoles(payload){
  try{
    let raw = payload?.authorities ?? payload?.roles ?? payload?.role ?? payload?.scope ?? [];
    let list = Array.isArray(raw) ? raw : String(raw||'').split(/[,\s]+/);
    list = list
      .map(x => (x && typeof x === 'object' && x.authority) ? x.authority : x) // support [{authority:"ROLE_MANAGER"}]
      .map(s => String(s||'').trim().toLowerCase().replace(/^role[_:\-]/, ''));
    return list.filter(Boolean);
  }catch(e){ return []; }
}
function __deriveRole(list){
  if (list.includes('manager') || list.includes('admin') || list.includes('administrator')) return 'manager';
  if (list.includes('staff') || list.includes('employee')) return 'staff';
  if (list.includes('user')) return 'user';
  return list[0] || 'user';
}
function __applyRoleUI(role){
  try{
    const sys = document.querySelector('.sidebar__group[data-sec="system"]');
    if (sys && role !== 'manager') {
      sys.remove();
    }
  }catch(e){}
}
// END: role-based sidebar control (robust)
</script>
