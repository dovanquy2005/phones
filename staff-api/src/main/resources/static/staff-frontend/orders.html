<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>fonestore · Đơn hàng</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="icon" href="/user-frontend/assets/img/logo.svg" type="image/svg+xml">
  <script src="/staff-frontend/assets/js/api.js"></script>
  <style>
    :root{ --ink:#0f172a; --muted:#6b7280; --border:#e5e7eb; --brand:#111827; --radius:10px; }

    /* table & layout */
    .table{width:100%;border-collapse:collapse;table-layout:fixed}
    .table thead th,.table tbody td{padding:12px 16px;border-bottom:1px solid var(--border)}
    .table-wrap{overflow-x:auto}
    .page-title{margin:0}
    .empty{padding:16px;color:#6b7280;text-align:center}
    .grid{display:grid;gap:12px}
    .grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
    @media (max-width:720px){ .grid--2{grid-template-columns:1fr} }

    /* chips & search */
    .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600}
    .chip.is-active{background:#111827;color:#fff;border-color:#111827}
    .label{font-size:12px;color:#6b7280}
    .search-inline{display:flex;align-items:center;gap:8px;margin:8px 0 12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px}
    .search-inline input{flex:1;border:none;outline:none;background:transparent;font-size:14px}

    /* badges */
    .badge{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .badge--success{background:#dcfce7;color:#166534}
    .badge--warn{background:#fff7ed;color:#9a3412}
    .badge--neutral{background:#e0e7ff;color:#3730a3}
    .badge--danger{background:#fee2e2;color:#991b1b}
    .badge--pay-paid{background:#dcfce7;color:#166534}
    .badge--pay-unpaid{background:#fde68a;color:#92400e}

    /* inline editor */
    .status-cell{position:relative;display:flex;align-items:center;gap:8px}
    .status-toggle{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer}
    .status-toggle svg{width:14px;height:14px;transition:transform .15s ease}
    .status-cell.is-open .status-toggle svg{transform:rotate(180deg)}
    .status-select{display:none;position:absolute;top:50%;left:0;transform:translateY(-50%);z-index:10;min-width:170px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px 8px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
    .status-cell.is-open .status-select{display:block}

    /* pager */
    .pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:12px 8px;border-top:1px solid var(--border)}
    .pager .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
    .pager .btn[disabled]{opacity:.45;cursor:not-allowed}
    .pager .page{min-width:34px;text-align:center}
    .pager .is-active{background:#111827;color:#fff;border-color:#111827}

    /* header (simple) */
    .app-header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:#fff}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
    .header-spacer{flex:1}
    /* .avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;border:1px solid var(--border);display:inline-block} */
    .sidebar__link--active{background:#11182710;border-radius:10px;color:#111827;} 

    /* toast */
    .toast{position:fixed;right:16px;bottom:16px;z-index:60;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;font-size:14px}
    .toast.show{opacity:1;pointer-events:auto;transform:translateY(0)}
    /* Role badge (profile modal) */
    .role-badge{font-size:12px;padding:2px 8px;border-radius:999px}
    .role-badge.manager{background:#dcfce7;color:#166534}
    .role-badge.staff{background:#e5e7eb;color:#111827}
  </style>
</head>
<body>

<header class="app-header">
  <a class="brand" href="index.html" aria-label="fonestore">
    <img src="assets/logo.svg" alt="" class="brand__logo"/>
    <span class="brand__text">fonestore</span>
  </a>
  <div class="header-spacer"></div>
  <div class="header-actions">
    <details class="avatar-menu" id="avatarMenu">
      <summary class="avatar" aria-label="Tài khoản">
        <img id="avatarImg" src="https://api.dicebear.com/9.x/initials/svg?seed=--" alt=""/>
      </summary>
      <nav class="dropdown" aria-label="Tài khoản">
        <a href="#modal-profile" id="open-profile">Thông tin tài khoản</a>
        <a href="auth-login.html" id="btn-logout">Đăng xuất</a>
      </nav>
    </details>
  </div>
</header>

<div class="app-shell">
  <aside class="sidebar" aria-label="Điều hướng">
    <div class="sidebar__group" data-sec="sales">
      <p class="sidebar__heading">Bán hàng</p>
      <a class="sidebar__link sidebar__link--active" href="orders.html">Đơn hàng</a>
      <a class="sidebar__link" href="payments.html">Thanh toán</a>
      <a class="sidebar__link" href="customers.html">Khách hàng</a>
       
    </div>
    <div class="sidebar__group" data-sec="catalog">
      <p class="sidebar__heading">Hàng hóa</p>
      <a class="sidebar__link" href="products.html">Sản phẩm</a>
      <a class="sidebar__link" href="brands.html">Thương hiệu</a>
      <a class="sidebar__link" href="vouchers.html">Voucher</a>
    </div>
    <div class="sidebar__group" data-sec="system">
      <p class="sidebar__heading">Hệ thống</p>
      <a class="sidebar__link" href="staff.html">Nhân viên</a>
      <a class="sidebar__link" href="reports.html">Báo cáo</a>
        
    </div>
  </aside>

  <main class="content">
    <section class="toolbar"><h1 class="page-title">Đơn hàng</h1></section>

    <!-- Search -->
    <div class="search-inline" role="search" aria-label="Tìm kiếm đơn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke-linecap="round"/>
      </svg>
      <input id="q" placeholder="Tìm mã đơn / khách / SĐT…"/>
    </div>

    <section class="card">
      <div class="card__body">
        <div class="chips" id="chips-status">
          <span class="label">Trạng thái đơn:</span>
          <button class="chip is-active" data-v="">Tất cả</button>
          <button class="chip" data-v="PENDING">Chờ giao</button>
          <button class="chip" data-v="SHIPPING">Đang giao</button>
          <button class="chip" data-v="DELIVERED">Đã giao</button>
          <button class="chip" data-v="CANCELED">Hủy</button>
        </div>
        <div style="height:8px"></div>
        <div class="chips" id="chips-pay">
          <span class="label">Thanh toán:</span>
          <button class="chip is-active" data-v="">Tất cả</button>
          <button class="chip" data-v="UNPAID">Chưa thanh toán</button>
          <button class="chip" data-v="PAID">Đã thanh toán</button>
        </div>
      </div>
      <div class="card__body" style="border-top:1px solid var(--border)">
        <div class="grid grid--2">
          <div class="field"><label>Từ ngày</label><input id="from" type="date" class="input"/></div>
          <div class="field"><label>Đến ngày</label><input id="to" type="date" class="input"/></div>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:12px">
      <div class="card__body table-wrap">
        <table class="table" aria-describedby="pgsum">
          <thead>
            <tr><th>Mã</th><th>Khách</th><th>Tổng</th><th>TT đơn</th><th>Thanh toán</th><th>Ngày</th><th style="width:150px;text-align:right"></th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="7" class="empty">Đang tải…</td></tr></tbody>
        </table>
      </div>
      <div id="pager" class="pager"></div>
      <p id="pgsum" style="margin:0;padding:0 12px 12px;color:#6b7280;font-size:12px"></p>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Helpers ===== */
const API = location.origin;
const API_ORDERS = API + '/api/orders';

const qs = s=>document.querySelector(s);
const qsa = s=>Array.from(document.querySelectorAll(s));
const fmtVND = n => (Number(n)||0).toLocaleString('vi-VN').replace(/,/g,'.') + '₫';
const fmtDate = s => { if(!s) return ''; const d=new Date(s); if(isNaN(d)) return s; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
const token = ()=>localStorage.getItem('accessToken')||'';
if(!token()) location.href='/staff-frontend/auth-login.html';

async function apiFetch(url,opts={}){
  const h=new Headers(opts.headers||{}); if(token()) h.set('Authorization','Bearer '+token());
  if(opts.body && !(opts.body instanceof FormData) && !h.has('Content-Type')) h.set('Content-Type','application/json');
  const r=await fetch(url,{...opts,headers:h});
  if(!r.ok){
    if(r.status===401){localStorage.removeItem('accessToken');location.href='/staff-frontend/auth-login.html';}
    let msg=''; try{const j=await r.json(); msg=j.message||j.error||'';}catch{}
    // ném theo đúng mã để catch() xử lý 409 đẹp hơn
    const err = new Error(msg||`HTTP ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return r.status===204?null:r.json();
}

let state={orders:[], q:'', st:'', pay:'', from:null, to:null, page:1, per:10, pages:1};
const ORDER_OPTS = ['PENDING','SHIPPING','DELIVERED','CANCELED'];

/* Ma trận chuyển trạng thái hợp lệ (FE) */
const ALLOWED = {
  PENDING  : paid => new Set(['PENDING','SHIPPING','CANCELED', ...(paid?['DELIVERED']:[])]),
  SHIPPING : paid => new Set(['SHIPPING', ...(paid?['DELIVERED']:[])]),
  DELIVERED: _    => new Set(['DELIVERED']),            // trạng thái cuối
  CANCELED : _    => new Set(['CANCELED'])              // trạng thái cuối
};
const canTransition = (from,to,paid) => (ALLOWED[from]??(_=>new Set()))(paid).has(to);

function toast(m,t=1600){ const el=qs('#toast'); el.textContent=m; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),t); }

/* badges */
function payBadge(v){ v=String(v||'').toUpperCase(); return v==='PAID' ? '<span class="badge badge--pay-paid">Đã thanh toán</span>' : '<span class="badge badge--pay-unpaid">Chưa thanh toán</span>'; }
function stBadge(v){
  v=String(v||'').toUpperCase();
  if(v==='PENDING')   return '<span class="badge badge--warn">Chờ giao</span>';
  if(v==='SHIPPING')  return '<span class="badge badge--neutral">Đang giao</span>';
  if(v==='DELIVERED') return '<span class="badge badge--success">Đã giao</span>';
  if(v==='CANCELED')  return '<span class="badge badge--danger">Hủy</span>';
  return `<span class="badge">${v||'-'}</span>`;
}

/* parse snapshot safe */
function pickCustomer(o){
  if (o.customerName) return o.customerName;
  const snap = o.addressSnapshot ?? o.address_snapshot;
  if (!snap) return '';
  try{
    if (typeof snap === 'string') {
      const s = JSON.parse(snap);
      return (s && typeof s==='object') ? (s.name||'') : '';
    }
    if (typeof snap === 'object') return snap.name || '';
  }catch{}
  return '';
}

/* Map order row */
function mapOrder(o){
  const stRaw = (o.status ?? o.orderStatus ?? '').toString().toUpperCase();
  let payRaw = (o.paymentStatus ?? o.payStatus ?? ((o.paid===true)?'PAID':(o.paid===false?'UNPAID':''))).toString().toUpperCase();

  let orderSt = stRaw;
  if ((stRaw==='PAID' || stRaw==='UNPAID') && !payRaw){
    payRaw = stRaw;
    orderSt = (stRaw==='PAID') ? 'DELIVERED' : 'PENDING';
  }
  if (!orderSt) orderSt = 'PENDING';
  if (!payRaw)  payRaw  = 'UNPAID';

  const total = (o.total != null)
    ? o.total
    : (Number(o.subtotal)||0) - (Number(o.discount)||0) + (Number(o.shippingFee ?? o.shipping_fee)||0);

  return {
    id:        o.id ?? o.orderId,
    code:      o.code || `OD-${String(o.orderId ?? o.id).padStart(6,'0')}`,
    customer:  pickCustomer(o),
    total,
    createdAt: o.createdAt ?? o.created_at,
    status:    orderSt,
    paymentStatus: payRaw
  };
}

/* Load */
async function load(){
  qs('#rows').innerHTML = `<tr><td colspan="7" class="empty">Đang tải…</td></tr>`;
  let url=API_ORDERS, p=new URLSearchParams();
  if(state.st)   p.set('status',state.st);
  if(state.q)    p.set('q',state.q);
  if(state.from) p.set('from',state.from);
  if(state.to)   p.set('to',state.to);
  if([...p.keys()].length) url+='?'+p.toString();

  const raw=await apiFetch(url);
  const arr=Array.isArray(raw)?raw:(Array.isArray(raw?.content)?raw.content:(Array.isArray(raw?.items)?raw.items:[]));
  state.orders = arr.map(mapOrder); state.page=1; render();
}

function filtered(){
  return state.orders.filter(o=>{
    const q=state.q.trim().toLowerCase();
    const okSt = !state.st  || o.status===state.st;
    const okPay= !state.pay || o.paymentStatus===state.pay;
    const okQ  = !q || o.code.toLowerCase().includes(q) || String(o.customer||'').toLowerCase().includes(q);
    let okD = true;
    if(state.from) okD = okD && new Date(o.createdAt)>=new Date(state.from+'T00:00:00');
    if(state.to)   okD = okD && new Date(o.createdAt)<=new Date(state.to+'T23:59:59');
    return okSt && okPay && okQ && okD;
  });
}

function render(){
  const data=filtered();
  const total=data.length; state.pages=Math.max(1,Math.ceil(total/state.per));
  if(state.page>state.pages) state.page=state.pages;
  const start=(state.page-1)*state.per, end=start+state.per, items=data.slice(start,end);
  qs('#pgsum').textContent = total?`Hiển thị ${start+1}–${Math.min(end,total)} / ${total}`:'';
  if(!items.length){ qs('#rows').innerHTML=`<tr><td colspan="7" class="empty">Không có đơn</td></tr>`; qs('#pager').innerHTML=''; return; }

  qs('#rows').innerHTML = items.map(o=>{
    const paid = (o.paymentStatus==='PAID');
    const allowed = (ALLOWED[o.status] ?? (_=>new Set()))(paid);

    const opts = ORDER_OPTS.map(v=>{
      const label = v==='PENDING'?'Chờ giao':v==='SHIPPING'?'Đang giao':v==='DELIVERED'?'Đã giao':'Hủy';
      const dis   = allowed.has(v) ? '' : 'disabled';
      return `<option value="${v}" ${v===o.status?'selected':''} ${dis}>${label}</option>`;
    }).join('');

    const printLabel = paid ? 'In hóa đơn' : 'In phiếu giao hàng';
    const printMode  = paid ? 'invoice'   : 'proforma';

    return `<tr data-id="${o.id}">
      <td>${o.code}</td>
      <td>${o.customer||'-'}</td>
      <td>${fmtVND(o.total)}</td>
      <td class="status-cell">
        ${stBadge(o.status)}
        <button class="status-toggle" data-toggle="order" aria-label="Đổi trạng thái đơn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <select class="status-select" aria-label="Chỉnh trạng thái đơn">${opts}</select>
      </td>
      <td>${payBadge(o.paymentStatus)}</td>
      <td>${fmtDate(o.createdAt)}</td>
      <td style="text-align:right">
        <button class="btn btn--sm" data-print="${o.id}" data-mode="${printMode}">${printLabel}</button>
      </td>
    </tr>`;
  }).join('');

  // pager
  const pages=[]; const n=5; let s=Math.max(1,state.page-Math.floor(n/2)); let e=s+n-1; if(e>state.pages){e=state.pages; s=Math.max(1,e-n+1);}
  for(let i=s;i<=e;i++) pages.push(i);
  qs('#pager').innerHTML = `
    <button class="btn" data-page="prev" ${state.page<=1?'disabled':''}>‹‹</button>
    ${pages.map(i=>`<button class="btn page ${i===state.page?'is-active':''}" data-page="${i}">${i}</button>`).join('')}
    <button class="btn" data-page="next" ${state.page>=state.pages?'disabled':''}>››</button>`;
}

/* Update Order status (theo ma trận ALLOWED + fallback 409) */
async function updateOrderStatus(id, val){
  if(!ORDER_OPTS.includes(val)) return alert('Trạng thái không hợp lệ');
  const row = state.orders.find(o=>o.id==id); if(!row) return;

  const from = row.status, paid = (row.paymentStatus==='PAID');
  if (!canTransition(from, val, paid)) {
    if (val==='DELIVERED' && !paid) {
      alert('Đơn chưa “ĐÃ THU TIỀN” nên không thể chuyển sang “Đã giao”. Vào trang Thanh toán để đánh dấu.');
    } else {
      alert(`Không thể chuyển từ “${from}” → “${val}”.`);
    }
    render(); // trả UI về đúng allowed/disabled
    return;
  }

  const prev = from;
  state.orders = state.orders.map(o=>o.id==id?{...o,status:val}:o);
  render();

  try{
    const up = await apiFetch(`${location.origin}/api/orders/${id}/status`, {
      method:'PATCH', body:JSON.stringify({status:val})
    });
    if(up && (up.id||up.orderId)){
      const nid = up.id ?? up.orderId;
      const st  = String(up.status??val).toUpperCase();
      const pay = String(up.paymentStatus ?? up.payStatus ?? '').toUpperCase();
      state.orders = state.orders.map(o=>o.id==nid?{...o,status:st,paymentStatus:pay||o.paymentStatus}:o);
      render();
    }
    toast('Đã cập nhật trạng thái đơn');
  }catch(e){
    state.orders = state.orders.map(o=>o.id==id?{...o,status:prev}:o);
    render();
    if (e.status===409) alert('Chuyển trạng thái không hợp lệ (409).'); else alert('Cập nhật thất bại: '+(e.message||''));
  }
}

/* ===== Events ===== */
document.addEventListener('DOMContentLoaded', async ()=>{
  // logout
  document.getElementById('btn-logout')?.addEventListener('click', ()=> localStorage.removeItem('accessToken'));

  // chips
  qs('#chips-status').addEventListener('click', e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    qsa('#chips-status .chip').forEach(x=>x.classList.remove('is-active')); b.classList.add('is-active');
    state.st=b.dataset.v||''; state.page=1; render();
  });
  qs('#chips-pay').addEventListener('click', e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    qsa('#chips-pay .chip').forEach(x=>x.classList.remove('is-active')); b.classList.add('is-active');
    state.pay=b.dataset.v||''; state.page=1; render();
  });

  // search/date
  qs('#q').addEventListener('input', e=>{ state.q=e.target.value||''; state.page=1; render(); });
  qs('#from').addEventListener('change', e=>{ state.from=e.target.value||null; state.page=1; render(); });
  qs('#to').addEventListener('change', e=>{ state.to=e.target.value||null; state.page=1; render(); });

  // open editor & print
  document.addEventListener('click', e=>{
    const row=e.target.closest('tr[data-id]'); if(!row) return;

    const printBtn=e.target.closest('[data-print]');
    if(printBtn){
      const id=printBtn.dataset.print;
      const mode=printBtn.dataset.mode||'invoice';
      window.open(`/staff-frontend/invoice.html?orderId=${encodeURIComponent(id)}&mode=${mode}`,'_blank');
      return;
    }

    const toggle=e.target.closest('[data-toggle="order"]');
    if(toggle){
      const cell=toggle.closest('.status-cell');
      const open=cell.classList.contains('is-open');
      qsa('.status-cell.is-open').forEach(c=>c.classList.remove('is-open'));
      if(!open){ cell.classList.add('is-open'); cell.querySelector('select').focus(); toast('Chọn trạng thái đơn'); }
    }else{
      qsa('.status-cell.is-open').forEach(c=>{ if(!c.contains(e.target)) c.classList.remove('is-open'); });
    }
  });

  // change order status
  document.addEventListener('change', e=>{
    const sel=e.target.closest('.status-select'); if(!sel) return;
    const id = e.target.closest('tr[data-id]').dataset.id;
    const val= sel.value;
    updateOrderStatus(id,val);
    sel.closest('.status-cell')?.classList.remove('is-open');
  });

  // pager
  qs('#pager').addEventListener('click', e=>{
    const b=e.target.closest('[data-page]'); if(!b) return;
    const v=b.dataset.page;
    if(v==='prev'&&state.page>1) state.page--;
    else if(v==='next'&&state.page<state.pages) state.page++;
    else if(!isNaN(+v)) state.page=+v;
    render();
  });

  await load();
});
</script>


<!-- Profile modal -->
<div class="modal" id="modal-profile" aria-hidden="true">
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <header class="modal__header">
      <h3 id="profileTitle" style="margin:0">Thông tin tài khoản</h3>
      <a class="modal__close" href="#" aria-label="Đóng">✕</a>
    </header>
    <div class="modal__body grid grid--2" id="profile-view">
      <div class="field" style="grid-column:1/-1;display:flex;align-items:center;gap:12px">
        <img id="profileAvatar" alt="AV" style="width:48px;height:48px;border-radius:50%;border:1px solid #e5e7eb"/>
        <div>
          <div id="profileName" style="font-weight:600">—</div>
          <div id="profileRole" class="role-badge" style="display:inline-block;margin-top:4px">—</div>
        </div>
      </div>
      <div class="field"><label>Họ tên</label><input class="input" id="profile_name" disabled/></div>
      <div class="field"><label>Email</label><input class="input" id="profile_email" disabled/></div>
      <div class="field"><label>Vai trò</label><input class="input" id="profile_role" disabled/></div>
    </div>
    <footer class="modal__footer" style="display:flex;justify-content:flex-end;gap:8px">
      <a class="btn" href="#">Đóng</a>
    </footer>
  </div>
</div>


<script>
// START: role-based sidebar control (robust) + header render hook ensure
(function(){
  const getToken = () =>
    (typeof window.getToken === 'function' ? window.getToken() : localStorage.getItem('accessToken') || '');

  function decodeJwt(token){
    try{
      const p = token.split('.')[1];
      const json = atob(p.replace(/-/g,'+').replace(/_/g,'/'));
      return JSON.parse(decodeURIComponent(escape(json)));
    }catch{ return null; }
  }
  function __extractRoles(payload){
    try{
      let raw = payload?.authorities ?? payload?.roles ?? payload?.role ?? payload?.scope ?? [];
      let list = Array.isArray(raw) ? raw : String(raw||'').split(/[,\s]+/);
      list = list
        .map(x => (x && typeof x === 'object' && x.authority) ? x.authority : x)
        .map(s => String(s||'').trim().toLowerCase().replace(/^role[_:\-]/, ''));
      return list.filter(Boolean);
    }catch(e){ return []; }
  }
  function __deriveRole(list){
    if (list.includes('manager') || list.includes('admin') || list.includes('administrator')) return 'manager';
    if (list.includes('staff') || list.includes('employee')) return 'staff';
    if (list.includes('user')) return 'user';
    return list[0] || 'user';
  }
  function __applyRoleUI(role){
    try{
      const sys = document.querySelector('.sidebar__group[data-sec="system"]');
      if (sys && role !== 'manager') sys.remove();
    }catch(e){}
  }
  function initials(s){
    const t = (s||'').trim(); if(!t) return '--';
    const parts = t.split(/\s+/);
    const a = (parts[0]||'')[0]||'', b = (parts[parts.length-1]||'')[0]||'';
    return (a+b || t.slice(0,2)).toUpperCase();
  }
  function fillProfile({name,email,role}){
    const avHeader = document.getElementById('avatarImg');
    if (avHeader) avHeader.src = `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(initials(name))}`;
    const av = document.getElementById('profileAvatar');
    if (av) av.src = `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(initials(name))}`;
    const n1 = document.getElementById('profileName');  if (n1) n1.textContent = name;
    const r1 = document.getElementById('profileRole');
    if (r1){
      r1.textContent = role==='manager'?'Manager':(role==='staff'?'Staff':role);
      r1.className = 'role-badge ' + (role==='manager'?'manager':(role==='staff'?'staff':''));
    }
    const iN = document.getElementById('profile_name'); if (iN) iN.value = name;
    const iE = document.getElementById('profile_email');if (iE) iE.value = email;
    const iR = document.getElementById('profile_role'); if (iR) iR.value = r1 ? r1.textContent : role;
  }

  const token = getToken(); if (!token) return;
  const payload = decodeJwt(token) || {};
  const roles = __extractRoles(payload);
  const role  = __deriveRole(roles);
  const name  = payload.name || payload.fullName || payload.given_name || payload.sub || 'Người dùng';
  const email = payload.email || payload.username || '—';

  fillProfile({name,email,role});
  __applyRoleUI(role);

  document.getElementById('btn-logout')?.addEventListener('click', ()=> localStorage.removeItem('accessToken'));
})();
</script>
</body>
