# ==========================
# ⚙️ Server Settings
# ==========================
server.port=9090

# ⚙️ Database Settings
# ==========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=phone_store;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=none          
spring.jpa.show-sql=true                    
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

logging.level.com.fonestore.user_api=DEBUG
logging.level.com.fonestore.user_api.config=DEBUG
logging.level.com.fonestore=DEBUG


management.endpoints.web.exposure.include=mappings
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

server.error.include-message=always
server.error.include-binding-errors=always

logging.level.org.springframework.http.converter.json=TRACE

app.jwt.secret=12345678901234567890123456789012
app.jwt.expiration-seconds=86400