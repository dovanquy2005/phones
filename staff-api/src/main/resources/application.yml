server:
  port: 9090

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=Phone_store;encrypt=false;trustServerCertificate=true;socketTimeout=10000
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
    open-in-view: false
